<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Dino Xperience Camp - High Efficiency</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  const firebaseConfig = {
    apiKey: "AIzaSyC04k_HrMfybVjr-CzVfY2Zh6J9TN_RiqE", authDomain: "hd-system-manager.firebaseapp.com",
    projectId: "hd-system-manager", storageBucket: "hd-system-manager.firebasestorage.app",
    messagingSenderId: "919090115313", appId: "1:919090115313:web:d85af64c55cb825c8def50"
  };
  const fbApp = initializeApp(firebaseConfig);
  window.HDFirebase = {
    auth: getAuth(fbApp), db: getFirestore(fbApp), storage: getStorage(fbApp),
    onAuthStateChanged, signInWithEmailAndPassword, signOut,
    doc, setDoc, getDoc, collection, getDocs, deleteDoc,
    ref, uploadBytes, getDownloadURL, ready: true
  };
  window.dispatchEvent(new Event("hdfirebase-ready"));
</script>
<style>
:root{--accent:#16a34a;--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;outline:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo,useContext,createContext,useRef}=React;
const AppDataContext = createContext();
const AuthContext = createContext();
const DB_KEY="happyDino_v1";

// --- GLOBAL PROVIDER ---
function AppProvider({ children }) {
  const [db, setDbState] = useState(() => JSON.parse(localStorage.getItem(DB_KEY) || "{}"));
  const updateDB = useCallback((p) => {
    setDbState(prev => {
      const next = { ...prev, ...p };
      localStorage.setItem(DB_KEY, JSON.stringify(next));
      return next;
    });
  }, []);
  const nextDocNo = (pre) => {
    const s = { ...db.acctSeq }; s[pre] = (s[pre] || 0) + 1;
    updateDB({ acctSeq: s });
    return `${pre}-${new Date().getFullYear()}-${String(s[pre]).padStart(4, "0")}`;
  };
  return <AppDataContext.Provider value={{ db, updateDB, nextDocNo }}>{children}</AppDataContext.Provider>;
}

// --- UTILS ---
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=(n)=>`RM ${parseFloat(n||0).toFixed(2)}`;
const fmtDate=(d)=>d?new Date(d).toLocaleDateString("en-MY",{day:"2-digit",month:"short",year:"numeric"}):"—";
const uploadToFirebase = async (file) => {
  const F = window.HDFirebase;
  const storageRef = F.ref(F.storage, `receipts/${Date.now()}-${file.name}`);
  const snap = await F.uploadBytes(storageRef, file);
  return await F.getDownloadURL(snap.ref);
};

// --- AUTH HOOK ---
function useAuth() {
  const [user, setUser] = useState(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    const init = () => {
      if (!window.HDFirebase?.ready) return;
      window.HDFirebase.onAuthStateChanged(window.HDFirebase.auth, async (fbUser) => {
        if (fbUser) {
          const s = await window.HDFirebase.getDoc(window.HDFirebase.doc(window.HDFirebase.db, "users", fbUser.uid));
          setUser(s.exists() ? { id: fbUser.uid, ...s.data() } : { id: fbUser.uid, role: 'viewer', name: fbUser.email });
        } else setUser(null);
        setReady(true);
      });
    };
    init();
  }, []);
  return { user, ready };
}

// --- UI COMPONENTS ---
const btn = (v = "primary") => ({ padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 13, background: v === "primary" ? "var(--accent)" : v === "danger" ? "#ef4444" : "var(--surface2)", color: v === "ghost" ? "var(--text)" : "#fff" });
function Badge({ label, color }) {
  const bgs = { green: "#dcfce7", blue: "#dbeafe", amber: "#fef3c7", red: "#fee2e2" };
  const txs = { green: "#16a34a", blue: "#2563eb", amber: "#d97706", red: "#dc2626" };
  return <span style={{ display: "inline-block", padding: "2px 8px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: bgs[color] || "#f1f5f9", color: txs[color] || "#64748b" }}>{label}</span>;
}

// --- MODULE: SCHOOLS ---
function Schools() {
  const { db, updateDB } = useContext(AppDataContext);
  const [modal, setModal] = useState({ open: false, data: {} });
  const list = db.schools || [];
  const save = () => {
    const updated = modal.data.id ? list.map(s => s.id === modal.data.id ? modal.data : s) : [...list, { ...modal.data, id: uid() }];
    updateDB({ schools: updated });
    setModal({ open: false, data: {} });
  };
  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', marginBottom:20}}>
        <h2>Schools</h2>
        <button onClick={() => setModal({open:true, data:{}})} style={btn()}>+ Add School</button>
      </div>
      <div style={{display:'grid', gap:10}}>
        {list.map(s => <div key={s.id} className="card" style={{display:'flex', justifyContent:'space-between'}}>
          <div><strong>{s.name}</strong><div style={{fontSize:12, color:'var(--muted)'}}>{s.address}</div></div>
          <button onClick={() => setModal({open:true, data:s})} style={btn("ghost")}>Edit</button>
        </div>)}
      </div>
      {modal.open && <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100}}>
          <div className="card" style={{width:400}}>
            <h3>School Details</h3>
            <div style={{marginTop:15}}>
              <label>Name</label><input value={modal.data.name||""} onChange={e=>setModal({...modal, data:{...modal.data, name:e.target.value}})} />
              <label>Address</label><input value={modal.data.address||""} onChange={e=>setModal({...modal, data:{...modal.data, address:e.target.value}})} />
            </div>
            <div style={{display:'flex', gap:10, marginTop:20}}>
              <button onClick={save} style={btn()}>Save</button>
              <button onClick={() => setModal({open:false})} style={btn("ghost")}>Cancel</button>
            </div>
          </div>
      </div>}
    </div>
  );
}

// --- MODULE: STUDENTS ---
function Students() {
  const { db, updateDB } = useContext(AppDataContext);
  const [modal, setModal] = useState({ open: false, data: {} });
  const list = db.students || [];
  const sizes = db.tshirtSizes || [];

  const save = () => {
    const updated = modal.data.id ? list.map(s => s.id === modal.data.id ? modal.data : s) : [...list, { ...modal.data, id: uid() }];
    updateDB({ students: updated });
    setModal({ open: false, data: {} });
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', marginBottom:20}}>
        <h2>Students</h2>
        <button onClick={() => setModal({open:true, data:{}})} style={btn()}>+ Add Student</button>
      </div>
      <div style={{display:'grid', gap:10}}>
        {list.map(s => (
          <div key={s.id} className="card" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div>
              <strong>{s.name}</strong>
              <div style={{fontSize:12, color:'var(--muted)'}}>{s.className} · Age {calcAge(s.dob)}</div>
            </div>
            <button onClick={() => setModal({open:true, data:s})} style={btn("ghost")}>Edit</button>
          </div>
        ))}
      </div>
      {modal.open && <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100}}>
        <div className="card" style={{width:500, maxHeight:'90vh', overflowY:'auto'}}>
          <h3>Student Details</h3>
          <div style={{marginTop:15, display:'grid', gap:10}}>
            <label>Full Name</label><input value={modal.data.name||""} onChange={e=>setModal({...modal, data:{...modal.data, name:e.target.value}})} />
            <label>IC / MyKid</label><input value={modal.data.ic||""} onChange={e=>setModal({...modal, data:{...modal.data, ic:e.target.value}})} />
            <label>Date of Birth</label><input type="date" value={modal.data.dob||""} onChange={e=>setModal({...modal, data:{...modal.data, dob:e.target.value}})} />
            <label>Class</label><input value={modal.data.className||""} onChange={e=>setModal({...modal, data:{...modal.data, className:e.target.value}})} />
            <label>T-Shirt Size</label>
            <select value={modal.data.tshirtSize||""} onChange={e=>setModal({...modal, data:{...modal.data, tshirtSize:e.target.value}})}>
              <option value="">Select Size</option>
              {sizes.map(sz => <option key={sz.id} value={sz.label}>{sz.label}</option>)}
            </select>
          </div>
          <div style={{display:'flex', gap:10, marginTop:20}}>
            <button onClick={save} style={btn()}>Save</button>
            <button onClick={() => setModal({open:false})} style={btn("ghost")}>Cancel</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

// --- MODULE: PURCHASES (FIREBASE STORAGE ENABLED) ---
function Purchases() {
  const { db, updateDB, nextDocNo } = useContext(AppDataContext);
  const [modal, setModal] = useState({ open: false, data: {} });
  const [busy, setBusy] = useState(false);
  const list = db.purchases || [];

  const save = async () => {
    setBusy(true);
    try {
      let photoUrl = modal.data.photo || "";
      const fileEl = document.getElementById("receipt-upload");
      if (fileEl?.files[0]) {
        photoUrl = await uploadToFirebase(fileEl.files[0]);
      }
      const record = { ...modal.data, photo: photoUrl, id: modal.data.id || uid() };
      const updated = modal.data.id ? list.map(p => p.id === modal.data.id ? record : p) : [...list, record];
      updateDB({ purchases: updated });
      setModal({ open: false, data: {} });
    } catch (e) { alert("Upload failed: " + e.message); }
    finally { setBusy(false); }
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', marginBottom:20}}>
        <h2>Purchases</h2>
        <button onClick={() => setModal({open:true, data:{ docNo: nextDocNo("PUR"), date: new Date().toISOString().slice(0,10) }})} style={btn()}>+ Record Purchase</button>
      </div>
      <div style={{display:'grid', gap:10}}>
        {list.map(p => (
          <div key={p.id} className="card" style={{display:'flex', justifyContent:'space-between'}}>
            <div><strong>{p.supplier || "Vendor"}</strong><div>{fmt(p.amount)} · {p.docNo}</div></div>
            {p.photo && <a href={p.photo} target="_blank" style={btn("ghost")}>View Receipt</a>}
          </div>
        ))}
      </div>
      {modal.open && <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100}}>
        <div className="card" style={{width:400}}>
          <h3>{modal.data.docNo}</h3>
          <div style={{marginTop:15, display:'grid', gap:10}}>
            <label>Vendor</label><input value={modal.data.supplier||""} onChange={e=>setModal({...modal, data:{...modal.data, supplier:e.target.value}})} />
            <label>Amount (RM)</label><input type="number" value={modal.data.amount||""} onChange={e=>setModal({...modal, data:{...modal.data, amount:e.target.value}})} />
            <label>Receipt Photo</label><input type="file" id="receipt-upload" accept="image/*" />
          </div>
          <div style={{display:'flex', gap:10, marginTop:20}}>
            <button onClick={save} disabled={busy} style={btn()}>{busy ? "Uploading..." : "Save"}</button>
            <button onClick={() => setModal({open:false})} style={btn("ghost")}>Cancel</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

// --- MAIN APP COMPONENT ---
function App() {
  const { user, ready } = useAuth();
  const { db } = useContext(AppDataContext);
  const [page, setPage] = useState("dashboard");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");

  if (!ready) return <div style={{padding:100, textAlign:'center'}}>🦕 Loading Happy Dino System...</div>;

  if (!user) return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#f1f5f9'}}>
      <div className="card" style={{width:320, textAlign:'center'}}>
        <h1 style={{color:'var(--accent)', marginBottom:20}}>Login</h1>
        <input placeholder="Email" style={{marginBottom:10}} onChange={e => setEmail(e.target.value)} />
        <input type="password" placeholder="Password" style={{marginBottom:20}} onChange={e => setPass(e.target.value)} />
        <button style={{...btn(), width:'100%'}} onClick={() => window.HDFirebase.signInWithEmailAndPassword(window.HDFirebase.auth, email, pass).catch(e => alert(e.message))}>Login</button>
      </div>
    </div>
  );

  return (
    <div style={{display:'flex', minHeight:'100vh'}}>
      <aside style={{width:240, background:'#1e293b', color:'white', padding:20, position:'sticky', top:0, height:'100vh'}}>
        <h2 style={{color:'var(--accent)', marginBottom:30}}>🦕 Happy Dino</h2>
        <nav style={{display:'flex', flexDirection:'column', gap:8}}>
          <button onClick={() => setPage("dashboard")} style={{...btn("ghost"), color:'white', textAlign:'left'}}>🏠 Dashboard</button>
          <button onClick={() => setPage("schools")} style={{...btn("ghost"), color:'white', textAlign:'left'}}>🏫 Schools</button>
          <button onClick={() => setPage("students")} style={{...btn("ghost"), color:'white', textAlign:'left'}}>🎒 Students</button>
          <button onClick={() => setPage("purchases")} style={{...btn("ghost"), color:'white', textAlign:'left'}}>🧾 Accounting</button>
          <button onClick={() => window.HDFirebase.signOut(window.HDFirebase.auth)} style={{...btn("danger"), marginTop:20}}>Logout</button>
        </nav>
      </aside>
      <main style={{flex:1, padding:40}}>
        {page === "dashboard" && (
          <div>
            <h1>Dashboard</h1>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:20, marginTop:20}}>
              <div className="card" style={{borderLeft:'4px solid var(--accent)'}}>
                <div style={{fontSize:12, color:'var(--muted)'}}>TOTAL REVENUE</div>
                <div style={{fontSize:24, fontWeight:800}}>{fmt((db.payments||[]).filter(p=>p.status==='paid').reduce((a,p)=>a+parseFloat(p.amount||0),0))}</div>
              </div>
              <div className="card" style={{borderLeft:'4px solid #2563eb'}}>
                <div style={{fontSize:12, color:'var(--muted)'}}>TOTAL STUDENTS</div>
                <div style={{fontSize:24, fontWeight:800}}>{(db.students||[]).length}</div>
              </div>
            </div>
          </div>
        )}
        {page === "schools" && <Schools />}
        {page === "students" && <Students />}
        {page === "purchases" && <Purchases />}
      </main>
    </div>
  );
}

// --- RENDER ---
ReactDOM.createRoot(document.getElementById("root")).render(<AppProvider><App /></AppProvider>);
</script>
</body>
</html>
