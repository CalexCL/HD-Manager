// --- NEW PROVIDER COMPONENT ---
function AppProvider({ children }) {
  const [db, setDbState] = useState(() => {
    const saved = localStorage.getItem(DB_KEY);
    return saved ? JSON.parse(saved) : initialDB;
  });

  const updateDB = useCallback((partial) => {
    setDbState(prev => {
      const updated = { ...prev, ...partial };
      localStorage.setItem(DB_KEY, JSON.stringify(updated));
      return updated;
    });
  }, []);

  return (
    <AppDataContext.Provider value={{ db, updateDB }}>
      {children}
    </AppDataContext.Provider>
  );
}

// ── AUTH ──
const INACTIVITY_MS = 5 * 60 * 1000; // 5 minutes

function useAuth(){
  const [user,setUser]=useState(null);
  const [authReady,setAuthReady]=useState(false);
  const [inactiveWarning,setInactiveWarning]=useState(false); // show 1-min warning
  const [autoLogoutReason,setAutoLogoutReason]=useState("");
  const timerRef=React.useRef(null);
  const warnRef=React.useRef(null);
  const userRef=React.useRef(null); // keep logout callback stable
  userRef.current=user;

  // Look up this person's role + display name + permissions from Firestore
  const fetchProfile=async(fbUser)=>{
    const F=window.HDFirebase;
    try{
      const snap=await F.getDoc(F.doc(F.db,"users",fbUser.uid));
      if(snap.exists()){
        const data=snap.data();
        const role=data.role||"viewer";
        const permissions=data.permissions||defaultPermissions(role);
        return{id:fbUser.uid,email:fbUser.email,name:data.name||fbUser.email,role,permissions};
      }
      return{id:fbUser.uid,email:fbUser.email,name:fbUser.email,role:"viewer",permissions:defaultPermissions("viewer")};
    }catch(e){
      console.error("Failed to load user profile",e);
      return null;
    }
  };

  // Auto-logout: clear timers, sign out Firebase, reset state
  const doAutoLogout=React.useCallback(async()=>{
    const F=window.HDFirebase;
    clearTimeout(timerRef.current);
    clearTimeout(warnRef.current);
    setInactiveWarning(false);
    if(userRef.current)logAction(userRef.current.role,userRef.current.name,"AUTO_LOGOUT","Signed out due to inactivity");
    if(F&&F.ready)await F.signOut(F.auth);
    setUser(null);
    setAutoLogoutReason("You were signed out after 5 minutes of inactivity.");
  },[]);

  // Reset the inactivity timer on any user interaction
  const resetTimer=React.useCallback(()=>{
    if(!userRef.current)return; // not logged in, nothing to do
    clearTimeout(timerRef.current);
    clearTimeout(warnRef.current);
    setInactiveWarning(false);
    // Warn at 4 minutes (1 minute before logout)
    warnRef.current=setTimeout(()=>setInactiveWarning(true), INACTIVITY_MS - 60000);
    timerRef.current=setTimeout(()=>doAutoLogout(), INACTIVITY_MS);
  },[doAutoLogout]);

  // Attach inactivity listeners to the document
  useEffect(()=>{
    const events=["mousemove","mousedown","keydown","scroll","touchstart","click"];
    events.forEach(e=>document.addEventListener(e,resetTimer,{passive:true}));
    return()=>events.forEach(e=>document.removeEventListener(e,resetTimer));
  },[resetTimer]);

  // Start/stop timer based on login state
  useEffect(()=>{
    if(user){
      resetTimer();
    } else {
      clearTimeout(timerRef.current);
      clearTimeout(warnRef.current);
      setInactiveWarning(false);
    }
  },[user,resetTimer]);

  useEffect(()=>{
    let unsub=()=>{};
    const attach=()=>{
      const F=window.HDFirebase;
      if(!F||!F.ready)return;
      unsub=F.onAuthStateChanged(F.auth,async(fbUser)=>{
        if(fbUser){
          const profile=await fetchProfile(fbUser);
          setUser(profile);
        } else {
          setUser(null);
        }
        setAuthReady(true);
      });
    };
    if(window.HDFirebase&&window.HDFirebase.ready)attach();
    else window.addEventListener("hdfirebase-ready",attach,{once:true});
    return()=>unsub();
  },[]);

  const login=async(email,password)=>{
    const F=window.HDFirebase;
    if(!F||!F.ready)return{ok:false,reason:"Sign-in service is still loading. Please wait a moment and try again."};
    try{
      const cred=await F.signInWithEmailAndPassword(F.auth,email,password);
      const profile=await fetchProfile(cred.user);
      if(!profile)return{ok:false,reason:"Signed in, but could not load your account profile. Contact your Admin."};
      setUser(profile);
      setAutoLogoutReason("");
      logAction(profile.role,profile.name,"LOGIN",`${profile.name} logged in`);
      return{ok:true,profile};
    }catch(e){
      let reason="Invalid email or password.";
      if(e.code==="auth/too-many-requests")reason="Too many attempts — please wait a moment and try again.";
      else if(e.code==="auth/network-request-failed")reason="Network error — check your internet connection.";
      else if(e.code==="auth/invalid-email")reason="That doesn't look like a valid email address.";
      return{ok:false,reason};
    }
  };
  const logout=async()=>{
    const F=window.HDFirebase;
    clearTimeout(timerRef.current);
    clearTimeout(warnRef.current);
    if(user)logAction(user.role,user.name,"LOGOUT",`${user.name} logged out`);
    if(F&&F.ready)await F.signOut(F.auth);
    setUser(null);
    setAutoLogoutReason("");
  };
  return{user,login,logout,authReady,inactiveWarning,autoLogoutReason,resetTimer};
}

// ── GOOGLE DRIVE SAVE ──
function useGoogleDrive(){
  const [ready,setReady]=useState(false);
  const [initFailed,setInitFailed]=useState(false);
  const [signedIn,setSignedIn]=useState(false);
  const [account,setAccount]=useState(null);
  const tokenClient=useRef(null);
  const accessToken=useRef(null);
  const pendingResolve=useRef(null);

  useEffect(()=>{
    let cancelled=false;
    const tryInit=()=>{
      if(cancelled)return;
      if(window.google&&window.google.accounts&&window.gapi){
        window.gapi.load("client",()=>{
          if(cancelled)return;
          window.gapi.client.init({}).then(()=>{
            if(cancelled)return;
            tokenClient.current=window.google.accounts.oauth2.initTokenClient({
              client_id:GOOGLE_CLIENT_ID,
              scope:DRIVE_SCOPE,
              callback:(resp)=>{
                if(resp&&resp.access_token){
                  accessToken.current=resp.access_token;
                  setSignedIn(true);
                  fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+resp.access_token}})
                    .then(r=>r.ok?r.json():null).then(info=>{if(info)setAccount(info.email||info.name||"Google account");}).catch(()=>{});
                  if(pendingResolve.current){pendingResolve.current({ok:true});pendingResolve.current=null;}
                } else if(pendingResolve.current){
                  pendingResolve.current({ok:false,reason:"No access token returned."});
                  pendingResolve.current=null;
                }
              },
              error_callback:(err)=>{
                let reason="Sign-in was cancelled or blocked.";
                if(err&&err.type==="popup_failed_to_open")reason="The sign-in popup was blocked by your browser. Please allow popups for this site and try again.";
                else if(err&&err.type==="popup_closed")reason="The sign-in popup was closed before completing.";
                if(pendingResolve.current){pendingResolve.current({ok:false,reason});pendingResolve.current=null;}
              }
            });
            setReady(true);
          }).catch(e=>{setInitFailed(true);console.error("Drive init failed",e);});
        });
        return true;
      }
      return false;
    };

    // Poll every 300ms for up to 20s for the Google scripts to finish loading.
    // Unlike before, if this window elapses without success, we now explicitly
    // surface a failure state instead of leaving tokenClient permanently null
    // with no feedback to the user.
    if(tryInit())return;
    const check=setInterval(()=>{ if(tryInit())clearInterval(check); },300);
    const timeout=setTimeout(()=>{
      clearInterval(check);
      if(!tokenClient.current){setInitFailed(true);}
    },20000);
    return ()=>{cancelled=true;clearInterval(check);clearTimeout(timeout);};
  },[]);

  // Returns a promise that resolves once the popup completes (success or failure),
  // instead of returning immediately while the popup is still open.
  // forcePicker=true always shows Google's account chooser, so the person can pick
  // the correct account even if the browser has another one signed in already.
  const ensureSignedIn=(forcePicker)=>{
    return new Promise((resolve)=>{
      if(accessToken.current&&!forcePicker){resolve({ok:true});return;}
      if(!tokenClient.current){
        const msg=initFailed
          ?"Google sign-in failed to load. This usually means a browser extension (ad-blocker/privacy blocker) is blocking Google's scripts, or you're offline. Try disabling blockers for this site, or use a different browser, then reload the page."
          :"Google sign-in is still loading. Please wait a few seconds and try again.";
        resolve({ok:false,reason:msg});
        return;
      }
      pendingResolve.current=resolve;
      try{tokenClient.current.requestAccessToken({prompt:forcePicker?"select_account":"consent"});}
      catch(e){pendingResolve.current=null;resolve({ok:false,reason:e.message});}
    });
  };

  // Clears the current token/account and immediately re-prompts with the account
  // picker, so the person can switch to a different Google account.
  const switchAccount=async()=>{
    accessToken.current=null;setSignedIn(false);setAccount(null);
    return await ensureSignedIn(true);
  };

  const uploadToDrive=async(filename,content,mimeType)=>{
    const auth=await ensureSignedIn(false);
    if(!auth.ok)return{ok:false,reason:auth.reason};
    try{
      const metadata={name:filename,parents:[GOOGLE_DRIVE_FOLDER_ID]};
      const boundary="-------happydino_boundary";
      const delimiter="\r\n--"+boundary+"\r\n";
      const closeDelim="\r\n--"+boundary+"--";
      const multipartBody=
        delimiter+"Content-Type: application/json\r\n\r\n"+JSON.stringify(metadata)+
        delimiter+"Content-Type: "+mimeType+"\r\n\r\n"+content+
        closeDelim;
      const res=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{
        method:"POST",
        headers:{"Authorization":"Bearer "+accessToken.current,"Content-Type":"multipart/related; boundary="+boundary},
        body:multipartBody
      });
      if(res.status===401){
        // Token expired/invalid — clear and ask caller to retry, which will trigger a fresh sign-in.
        accessToken.current=null;setSignedIn(false);
        return{ok:false,reason:"Your Google session expired. Please click the button again to sign in and retry."};
      }
      if(!res.ok){const t=await res.text();return{ok:false,reason:`Drive API error (${res.status}): ${t.slice(0,200)}`};}
      const data=await res.json();
      return{ok:true,data};
    }catch(e){
      return{ok:false,reason:"Network error: "+e.message};
    }
  };

  // List files previously saved by this app in the target Drive folder, for the Load-from-Drive feature.
  const listDriveFiles=async()=>{
    const auth=await ensureSignedIn(false);
    if(!auth.ok)return{ok:false,reason:auth.reason};
    try{
      const q=encodeURIComponent(`'${GOOGLE_DRIVE_FOLDER_ID}' in parents and trashed=false`);
      const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime,mimeType)&orderBy=modifiedTime desc&pageSize=50`,{
        headers:{"Authorization":"Bearer "+accessToken.current}
      });
      if(res.status===401){accessToken.current=null;setSignedIn(false);return{ok:false,reason:"Your Google session expired. Please click again to sign in and retry."};}
      if(!res.ok){const t=await res.text();return{ok:false,reason:`Drive API error (${res.status}): ${t.slice(0,200)}`};}
      const data=await res.json();
      return{ok:true,files:data.files||[]};
    }catch(e){
      return{ok:false,reason:"Network error: "+e.message};
    }
  };

  const downloadDriveFile=async(fileId)=>{
    const auth=await ensureSignedIn(false);
    if(!auth.ok)return{ok:false,reason:auth.reason};
    try{
      const res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{
        headers:{"Authorization":"Bearer "+accessToken.current}
      });
      if(!res.ok){const t=await res.text();return{ok:false,reason:`Drive API error (${res.status}): ${t.slice(0,200)}`};}
      const text=await res.text();
      return{ok:true,content:text};
    }catch(e){
      return{ok:false,reason:"Network error: "+e.message};
    }
  };

  return{ready,initFailed,signedIn,account,uploadToDrive,listDriveFiles,downloadDriveFile,switchAccount};
}

function GlobalSearch({db,onResultClick}){
  const [q,setQ]=useState("");
  const [open,setOpen]=useState(false);
  const results=(()=>{
    if(!q||q.length<2)return[];
    const ql=q.toLowerCase();
    const out=[];
    (db.schools||[]).forEach(s=>{if(s.name?.toLowerCase().includes(ql))out.push({type:"School",label:s.name,sub:s.address,nav:"schools"});});
    (db.students||[]).forEach(s=>{if(s.name?.toLowerCase().includes(ql))out.push({type:"Student",label:s.name,sub:s.className,nav:"students"});});
    (db.crew||[]).forEach(c=>{if(c.name?.toLowerCase().includes(ql))out.push({type:"Crew",label:c.name,sub:c.phone,nav:"crew"});});
    return out.slice(0,8);
  })();
  return <div style={{position:"relative",flex:1,maxWidth:280}}>
    <input value={q} onChange={e=>{setQ(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)}
      placeholder="🔍 Search schools, students, crew..." style={{...inp,padding:"7px 12px",fontSize:12}}/>
    {open&&results.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,marginTop:4,boxShadow:"0 8px 24px rgba(0,0,0,0.15)",zIndex:200,maxHeight:300,overflowY:"auto"}}>
      {results.map((r,i)=><div key={i} onClick={()=>{onResultClick(r.nav);setQ("");setOpen(false);}} style={{padding:"8px 12px",cursor:"pointer",borderTop:i?"1px solid var(--border)":"none",fontSize:12}}
        onMouseDown={e=>e.preventDefault()}>
        <Badge label={r.type} color={r.type==="School"?"purple":r.type==="Student"?"blue":"green"}/> <b>{r.label}</b>
        {r.sub&&<div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{r.sub}</div>}
      </div>)}
    </div>}
  </div>;
}

// ── CAMP TYPES ──
function CampTypes({db,refresh,actor,onHome}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const campTypes=db.campTypes||[];
  const openAdd=()=>{setForm({id:uid(),name:"",fee:"",crewFeeTiers:[{id:uid(),role:"Lead Facilitator",fee:""},{id:uid(),role:"Facilitator",fee:""},{id:uid(),role:"Assistant",fee:""}],materialCost:"",mealCost:"",extraCosts:[],discountable:true,sibling2Pct:10,sibling3Pct:20,description:""});setEditing(null);setShowModal(true);};
  const openEdit=(c)=>{
    // Migrate legacy single crewFee into the tiers list if this camp type predates tiers.
    const tiers=c.crewFeeTiers&&c.crewFeeTiers.length>0?c.crewFeeTiers:
      [{id:uid(),role:"Lead Facilitator",fee:c.crewFee||""},{id:uid(),role:"Facilitator",fee:c.crewFee||""},{id:uid(),role:"Assistant",fee:c.crewFee||""}];
    setForm({...c,extraCosts:c.extraCosts||[],crewFeeTiers:tiers});setEditing(c.id);setShowModal(true);
  };
  const save=()=>{const list=editing?campTypes.map(c=>c.id===editing?form:c):[...campTypes,form];setDB({campTypes:list});logAction(actor.role,actor.name,editing?"EDIT_CAMPTYPE":"ADD_CAMPTYPE",form.name);refresh();setShowModal(false);};
  const del=(id)=>{const c=campTypes.find(x=>x.id===id);if(window.confirm("Delete?")){setDB({campTypes:campTypes.filter(c=>c.id!==id)});logAction(actor.role,actor.name,"DELETE_CAMPTYPE",c?.name);refresh();}};
  const editable=canEdit(actor,"campTypes");
  const addTier=()=>setForm({...form,crewFeeTiers:[...(form.crewFeeTiers||[]),{id:uid(),role:"",fee:""}]});
  const updateTier=(i,field,val)=>{const arr=[...form.crewFeeTiers];arr[i]={...arr[i],[field]:val};setForm({...form,crewFeeTiers:arr});};
  const removeTier=(i)=>setForm({...form,crewFeeTiers:form.crewFeeTiers.filter((_,j)=>j!==i)});
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Camp Types"]} onHome={onHome} title="Camp Types" action={editable&&<button onClick={openAdd} style={btn("primary")}>+ New Camp Type</button>}/>
    {campTypes.length===0?<EmptyState icon="🦖" text="No camp types yet."/>:
    <div style={{display:"grid",gap:10}}>
      {campTypes.map(c=>{
        const sessions=(db.sessions||[]).filter(s=>s.campTypeId===c.id).length;
        const totalCost=parseFloat(c.materialCost||0)+parseFloat(c.mealCost||0)+(c.extraCosts||[]).reduce((a,e)=>a+parseFloat(e.amount||0),0);
        const tiers=c.crewFeeTiers&&c.crewFeeTiers.length>0?c.crewFeeTiers:null;
        return <div key={c.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{c.name}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>Fee: <b>{fmt(c.fee)}</b> · Est. Cost: <b>{fmt(totalCost)}</b></div>
              <div style={{fontSize:12,color:"var(--muted)"}}>Crew: {tiers?tiers.map(t=>`${t.role||"—"} ${fmt(t.fee)}`).join(" · "):fmt(c.crewFee)}</div>
              {c.discountable&&<div style={{fontSize:12,color:"#7c3aed"}}>Sibling: 2nd -{c.sibling2Pct}% · 3rd -{c.sibling3Pct}%</div>}
            </div>
            <div style={{display:"flex",gap:6,alignItems:"flex-start"}}>
              <Badge label={`${sessions} sessions`} color="purple"/>
              {editable&&<button onClick={()=>openEdit(c)} style={btn("ghost")}>Edit</button>}
              {editable&&<button onClick={()=>del(c.id)} style={btn("danger")}>Del</button>}
            </div>
          </div>
        </div>;
      })}
    </div>}
    {showModal&&<Modal title={editing?"Edit Camp Type":"New Camp Type"} onClose={()=>setShowModal(false)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <Field label="Camp Name"><input style={inp} value={form.name||""} onChange={e=>setForm({...form,name:e.target.value})}/></Field>
        <Field label="Camp Fee (RM)"><input type="number" style={inp} value={form.fee||""} onChange={e=>setForm({...form,fee:e.target.value})}/></Field>
        <Field label="Material Cost (RM)"><input type="number" style={inp} value={form.materialCost||""} onChange={e=>setForm({...form,materialCost:e.target.value})}/></Field>
        <Field label="Meal Cost / Head (RM)"><input type="number" style={inp} value={form.mealCost||""} onChange={e=>setForm({...form,mealCost:e.target.value})}/></Field>
      </div>
      <div style={{fontWeight:700,fontSize:11,color:"var(--muted)",margin:"10px 0 6px",textTransform:"uppercase"}}>Crew Fee Tiers (per role, per session)</div>
      <div style={{fontSize:11,color:"var(--muted)",marginBottom:8}}>Set a default fee for each crew role. When assigning crew to a session, this default appears automatically based on the role chosen, and can still be overridden for a specific person.</div>
      {(form.crewFeeTiers||[]).map((t,i)=><div key={t.id||i} style={{display:"flex",gap:8,marginBottom:6}}>
        <input style={{...inp,flex:2}} placeholder="Role (e.g. Lead Facilitator)" value={t.role} onChange={e=>updateTier(i,"role",e.target.value)}/>
        <input type="number" style={{...inp,flex:1}} placeholder="RM" value={t.fee} onChange={e=>updateTier(i,"fee",e.target.value)}/>
        <button onClick={()=>removeTier(i)} style={{...btn("danger"),padding:"8px 10px"}}>✕</button>
      </div>)}
      <button onClick={addTier} style={{...btn("ghost"),fontSize:12,marginBottom:12}}>+ Add Fee Tier</button>
      <div style={{fontWeight:700,fontSize:11,color:"var(--muted)",margin:"10px 0 6px",textTransform:"uppercase"}}>Additional Cost Items</div>
      {(form.extraCosts||[]).map((ec,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:6}}>
        <input style={{...inp,flex:2}} placeholder="Label" value={ec.label} onChange={e=>{const ec2=[...form.extraCosts];ec2[i]={...ec2[i],label:e.target.value};setForm({...form,extraCosts:ec2});}}/>
        <input type="number" style={{...inp,flex:1}} placeholder="RM" value={ec.amount} onChange={e=>{const ec2=[...form.extraCosts];ec2[i]={...ec2[i],amount:e.target.value};setForm({...form,extraCosts:ec2});}}/>
        <button onClick={()=>setForm({...form,extraCosts:form.extraCosts.filter((_,j)=>j!==i)})} style={{...btn("danger"),padding:"8px 10px"}}>✕</button>
      </div>)}
      <button onClick={()=>setForm({...form,extraCosts:[...(form.extraCosts||[]),{label:"",amount:""}]})} style={{...btn("ghost"),fontSize:12,marginBottom:12}}>+ Add Cost Item</button>
      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,marginBottom:10}}>
        <input type="checkbox" checked={form.discountable||false} onChange={e=>setForm({...form,discountable:e.target.checked})}/> Enable sibling discount
      </label>
      {form.discountable&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <Field label="2nd Sibling Discount (%)"><input type="number" style={inp} value={form.sibling2Pct||""} onChange={e=>setForm({...form,sibling2Pct:e.target.value})}/></Field>
        <Field label="3rd+ Sibling Discount (%)"><input type="number" style={inp} value={form.sibling3Pct||""} onChange={e=>setForm({...form,sibling3Pct:e.target.value})}/></Field>
      </div>}
      <Field label="Description"><textarea style={{...inp,minHeight:50}} value={form.description||""} onChange={e=>setForm({...form,description:e.target.value})}/></Field>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={save} style={btn("primary")}>Save</button>
      </div>
    </Modal>}
  </div>;
}

// ── SESSIONS ──
function Sessions({db,refresh,initialFilter,actor,onHome}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [selected,setSelected]=useState(null);
  const [filter,setFilter]=useState(initialFilter||"all");
  const sessions=db.sessions||[];
  useEffect(()=>{if(initialFilter)setFilter(initialFilter);},[initialFilter]);
  const openAdd=()=>{setForm({id:uid(),schoolId:"",campTypeId:"",date:"",time:"",status:"scheduled",notes:""});setEditing(null);setShowModal(true);};
  const openEdit=(s)=>{setForm({...s});setEditing(s.id);setShowModal(true);};
  const save=()=>{const list=editing?sessions.map(s=>s.id===editing?form:s):[...sessions,form];setDB({sessions:list});logAction(actor.role,actor.name,editing?"EDIT_SESSION":"ADD_SESSION",form.date);refresh();setShowModal(false);};
  const del=(id)=>{if(window.confirm("Delete session?")){setDB({sessions:sessions.filter(s=>s.id!==id)});logAction(actor.role,actor.name,"DELETE_SESSION",id);refresh();}};
  const filtered=filter==="all"?sessions:sessions.filter(s=>s.status===filter);
  if(selected)return <SessionDetail session={selected} db={db} refresh={refresh} onBack={()=>setSelected(null)} actor={actor}/>;
  const editable=canEdit(actor,"sessions");
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Sessions",filter!=="all"?filter:null].filter(Boolean)} onHome={onHome} title="Camp Sessions" action={editable&&<button onClick={openAdd} style={btn("primary")}>+ New Session</button>}/>
    <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
      {["all","scheduled","completed","cancelled"].map(f=><button key={f} onClick={()=>setFilter(f)} style={{padding:"5px 12px",borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",fontWeight:600,fontSize:12,background:filter===f?"var(--accent)":"var(--surface)",color:filter===f?"#fff":"var(--text)",textTransform:"capitalize"}}>{f}</button>)}
    </div>
    {filtered.length===0?<EmptyState icon="📅" text="No sessions found."/>:
    <div style={{display:"grid",gap:10}}>
      {[...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(s=>{
        const school=(db.schools||[]).find(sc=>sc.id===s.schoolId);
        const ct=(db.campTypes||[]).find(c=>c.id===s.campTypeId);
        const regCount=(db.registrations||[]).filter(r=>r.sessionId===s.id).length;
        const crewCount=(db.crewAssignments||[]).filter(a=>a.sessionId===s.id).length;
        const sc={scheduled:"amber",completed:"green",cancelled:"red"};
        return <div key={s.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",cursor:"pointer"}} onClick={()=>setSelected(s)}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{school?.name||"—"} <span style={{fontWeight:400,fontSize:12,color:"var(--muted)"}}>· {ct?.name||"—"}</span></div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{fmtDate(s.date)}{s.time&&` at ${s.time}`}</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"flex-start"}}>
              <Badge label={s.status} color={sc[s.status]||"gray"}/>
              <Badge label={`${regCount} students`} color="blue"/>
              <Badge label={`${crewCount} crew`} color="purple"/>
              {editable&&<button onClick={e=>{e.stopPropagation();openEdit(s);}} style={btn("ghost")}>Edit</button>}
              {editable&&<button onClick={e=>{e.stopPropagation();del(s.id);}} style={btn("danger")}>Del</button>}
            </div>
          </div>
        </div>;
      })}
    </div>}
    {showModal&&<Modal title={editing?"Edit Session":"New Session"} onClose={()=>setShowModal(false)}>
      <Field label="School"><select style={inp} value={form.schoolId||""} onChange={e=>setForm({...form,schoolId:e.target.value})}>
        <option value="">Select school</option>{(db.schools||[]).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
      <Field label="Camp Type"><select style={inp} value={form.campTypeId||""} onChange={e=>setForm({...form,campTypeId:e.target.value})}>
        <option value="">Select camp type</option>{(db.campTypes||[]).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
        <Field label="Date"><input type="date" style={inp} value={form.date||""} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Time"><input type="time" style={inp} value={form.time||""} onChange={e=>setForm({...form,time:e.target.value})}/></Field>
      </div>
      <Field label="Status"><select style={inp} value={form.status||"scheduled"} onChange={e=>setForm({...form,status:e.target.value})}>
        <option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></Field>
      <Field label="Notes"><textarea style={{...inp,minHeight:60}} value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={save} style={btn("primary")}>Save</button>
      </div>
    </Modal>}
  </div>;
}

function SessionDetail({session,db,refresh,onBack,actor}){
  const [tab,setTab]=useState("registrations");
  const [s,setS]=useState(session);
  useEffect(()=>{const u=(db.sessions||[]).find(ss=>ss.id===s.id);if(u)setS(u);},[db]);
  const school=(db.schools||[]).find(sc=>sc.id===s.schoolId);
  const ct=(db.campTypes||[]).find(c=>c.id===s.campTypeId);
  const tabs=[{key:"registrations",label:"Registrations"},{key:"crew",label:"Crew"},{key:"attendance",label:"Attendance"},{key:"expenses",label:"Expenses"}];
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:null},{label:"Sessions",nav:null},school?.name||"Session"]} onBack={onBack} title={`${school?.name||""} — ${ct?.name||""}`}/>
    <div style={{fontSize:12,color:"var(--muted)",marginTop:-12,marginBottom:14}}>{fmtDate(s.date)}{s.time&&` at ${s.time}`}</div>
    <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>
      {tabs.map(t=><button key={t.key} onClick={()=>setTab(t.key)} style={{padding:"6px 14px",borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",fontWeight:600,fontSize:12,background:tab===t.key?"var(--accent)":"var(--surface)",color:tab===t.key?"#fff":"var(--text)"}}>{t.label}</button>)}
    </div>
    {tab==="registrations"&&<SessionRegistrations session={s} db={db} refresh={refresh} actor={actor}/>}
    {tab==="crew"&&<SessionCrew session={s} db={db} refresh={refresh} actor={actor}/>}
    {tab==="attendance"&&<SessionAttendance session={s} db={db} refresh={refresh} actor={actor}/>}
    {tab==="expenses"&&<SessionExpenses session={s} db={db} refresh={refresh} actor={actor}/>}
  </div>;
}

function SessionRegistrations({session,db,refresh,actor}){
  const [showModal,setShowModal]=useState(false);
  const [form,setForm]=useState({studentId:"",paymentOverride:""});
  const regs=(db.registrations||[]).filter(r=>r.sessionId===session.id);
  const ct=(db.campTypes||[]).find(c=>c.id===session.campTypeId);
  const schoolStudents=(db.students||[]).filter(st=>st.schoolId===session.schoolId);
  const calcFee=(studentId)=>{
    if(!ct)return 0;const base=parseFloat(ct.fee||0);if(!ct.discountable)return base;
    const student=(db.students||[]).find(s=>s.id===studentId);if(!student)return base;
    const siblings=(db.students||[]).filter(s=>s.parentPhone===student.parentPhone&&s.id!==student.id);
    const sibRegs=regs.filter(r=>siblings.map(s=>s.id).includes(r.studentId));
    if(sibRegs.length===0)return base;if(sibRegs.length===1)return base*(1-parseFloat(ct.sibling2Pct||0)/100);
    return base*(1-parseFloat(ct.sibling3Pct||0)/100);
  };
  const addReg=()=>{
    if(!form.studentId)return;
    const fee=form.paymentOverride||calcFee(form.studentId);
    const reg={id:uid(),sessionId:session.id,studentId:form.studentId,fee,consentSigned:false,present:false};
    const pay={id:uid(),registrationId:reg.id,studentId:form.studentId,sessionId:session.id,amount:fee,status:"unpaid",method:"",paidAt:"",invoiceNo:`INV-${Date.now()}`};
    setDB({registrations:[...(db.registrations||[]),reg],payments:[...(db.payments||[]),pay]});
    logAction(actor.role,actor.name,"REGISTER_STUDENT",form.studentId);
    refresh();setShowModal(false);setForm({studentId:"",paymentOverride:""});
  };
  const updatePay=(payId,status)=>{setDB({payments:(db.payments||[]).map(p=>p.id===payId?{...p,status,paidAt:status==="paid"?new Date().toISOString():p.paidAt}:p)});logAction(actor.role,actor.name,"UPDATE_PAYMENT",`${payId} -> ${status}`);refresh();};
  const toggleConsent=(regId)=>{setDB({registrations:(db.registrations||[]).map(r=>r.id===regId?{...r,consentSigned:!r.consentSigned}:r)});refresh();};
  const removeReg=(regId)=>{if(!window.confirm("Remove?"))return;setDB({registrations:(db.registrations||[]).filter(r=>r.id!==regId)});refresh();};
  const printInvoice=(reg)=>{
    const student=(db.students||[]).find(s=>s.id===reg.studentId);
    const pay=(db.payments||[]).find(p=>p.registrationId===reg.id);
    const school=(db.schools||[]).find(s=>s.id===session.schoolId);
    const campType=(db.campTypes||[]).find(c=>c.id===session.campTypeId);
    if(pay)generateInvoicePDF(pay,student,session,school,campType,getDB().settings);
  };
  const available=schoolStudents.filter(s=>!regs.map(r=>r.studentId).includes(s.id));
  const totalFees=regs.reduce((a,r)=>a+parseFloat(r.fee||0),0);
  const editable=canEdit(actor,"sessions");
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{fontSize:13,color:"var(--muted)"}}>{regs.length} registered · Total: <b style={{color:"var(--text)"}}>{fmt(totalFees)}</b></div>
      {editable&&<button onClick={()=>setShowModal(true)} style={btn("primary")}>+ Register Student</button>}
    </div>
    {regs.length===0?<EmptyState icon="📋" text="No registrations yet."/>:
    <div style={{display:"grid",gap:8}}>
      {regs.map(reg=>{
        const student=(db.students||[]).find(s=>s.id===reg.studentId);
        const pay=(db.payments||[]).find(p=>p.registrationId===reg.id);
        return <div key={reg.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,alignItems:"center"}}>
          <div>
            <div style={{fontWeight:600,fontSize:13}}>{student?.name||"—"}</div>
            <div style={{fontSize:12,color:"var(--muted)"}}>{student?.parentName} · {student?.parentPhone}</div>
            <div style={{fontSize:11,color:"var(--muted)"}}>Inv: {pay?.invoiceNo}</div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:13,fontWeight:700}}>{fmt(reg.fee)}</span>
            <Badge label={pay?.status||"—"} color={pay?.status==="paid"?"green":pay?.status==="refunded"?"red":"amber"}/>
            <Badge label={reg.consentSigned?"Consent ✓":"No consent"} color={reg.consentSigned?"green":"red"}/>
            {editable&&pay?.status==="unpaid"&&<button onClick={()=>updatePay(pay.id,"paid")} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>Mark Paid</button>}
            {editable&&pay?.status==="paid"&&<button onClick={()=>updatePay(pay.id,"refunded")} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>Refund</button>}
            {editable&&<button onClick={()=>toggleConsent(reg.id)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>Consent</button>}
            <button onClick={()=>printInvoice(reg)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>🖨 Invoice</button>
            {editable&&<button onClick={()=>removeReg(reg.id)} style={{...btn("danger"),fontSize:11,padding:"3px 8px"}}>✕</button>}
          </div>
        </div>;
      })}
    </div>}
    {showModal&&editable&&<Modal title="Register Student" onClose={()=>setShowModal(false)}>
      <Field label="Student"><select style={inp} value={form.studentId} onChange={e=>setForm({...form,studentId:e.target.value})}>
        <option value="">Select student</option>{available.map(s=><option key={s.id} value={s.id}>{s.name} — {s.className}</option>)}</select></Field>
      {form.studentId&&ct&&<div style={{background:"var(--surface2)",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:13}}>
        Calculated fee: <b>{fmt(calcFee(form.studentId))}</b>{ct.discountable&&<span style={{color:"var(--muted)",fontSize:11}}> (sibling discount auto-applied)</span>}</div>}
      <Field label="Override Fee" hint="Leave blank to use calculated fee">
        <input type="number" style={inp} value={form.paymentOverride} onChange={e=>setForm({...form,paymentOverride:e.target.value})} placeholder={ct?`Default: ${fmt(ct.fee)}`:""}/></Field>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={addReg} style={btn("primary")}>Register</button>
      </div>
    </Modal>}
  </div>;
}

function SessionCrew({session,db,refresh,actor}){
  const [showModal,setShowModal]=useState(false);
  const [form,setForm]=useState({crewId:"",role:"Facilitator",feeOverride:""});
  const assignments=(db.crewAssignments||[]).filter(a=>a.sessionId===session.id);
  const ct=(db.campTypes||[]).find(c=>c.id===session.campTypeId);
  const available=(db.crew||[]).filter(c=>!assignments.map(a=>a.crewId).includes(c.id));
  const tiers=ct?.crewFeeTiers&&ct.crewFeeTiers.length>0?ct.crewFeeTiers:null;

  // Priority: role-based tier from the Camp Type first (most specific to this camp),
  // then this crew member's own default fee, then the legacy flat crewFee, then 0.
  const suggestedFee=(role,crewId)=>{
    const tier=tiers?.find(t=>t.role===role);
    if(tier&&tier.fee)return tier.fee;
    const crewMember=(db.crew||[]).find(c=>c.id===crewId);
    if(crewMember?.defaultFee)return crewMember.defaultFee;
    return ct?.crewFee||0;
  };

  const add=()=>{
    if(!form.crewId)return;
    const fee=form.feeOverride||suggestedFee(form.role,form.crewId);
    setDB({crewAssignments:[...(db.crewAssignments||[]),{id:uid(),sessionId:session.id,crewId:form.crewId,role:form.role,fee,paid:false}]});
    logAction(actor.role,actor.name,"ASSIGN_CREW",form.crewId);
    refresh();setShowModal(false);setForm({crewId:"",role:"Facilitator",feeOverride:""});
  };
  const togglePaid=(id)=>{setDB({crewAssignments:(db.crewAssignments||[]).map(a=>a.id===id?{...a,paid:!a.paid}:a)});refresh();};
  const remove=(id)=>{setDB({crewAssignments:(db.crewAssignments||[]).filter(a=>a.id!==id)});refresh();};
  const editable=canEdit(actor,"sessions");
  const roleOptions=tiers?tiers.map(t=>t.role).filter(Boolean):["Lead Facilitator","Facilitator","Assistant","Driver","Support"];
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{fontSize:13,color:"var(--muted)"}}>{assignments.length} crew assigned</div>
      {editable&&<button onClick={()=>setShowModal(true)} style={btn("primary")}>+ Assign Crew</button>}
    </div>
    {assignments.length===0?<EmptyState icon="👥" text="No crew assigned yet."/>:
    <div style={{display:"grid",gap:8}}>
      {assignments.map(a=>{
        const crew=(db.crew||[]).find(c=>c.id===a.crewId);
        return <div key={a.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,alignItems:"center"}}>
          <div><div style={{fontWeight:600,fontSize:13}}>{crew?.name||"—"}</div><div style={{fontSize:12,color:"var(--muted)"}}>{a.role} · {"★".repeat(Math.round(crew?.rating||0))}</div></div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <span style={{fontWeight:700,fontSize:13}}>{fmt(a.fee)}</span>
            <Badge label={a.paid?"Paid":"Unpaid"} color={a.paid?"green":"amber"}/>
            {editable&&<button onClick={()=>togglePaid(a.id)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>{a.paid?"Unmark":"Mark Paid"}</button>}
            {editable&&<button onClick={()=>remove(a.id)} style={{...btn("danger"),fontSize:11,padding:"3px 8px"}}>Remove</button>}
          </div>
        </div>;
      })}
    </div>}
    {showModal&&editable&&<Modal title="Assign Crew" onClose={()=>setShowModal(false)}>
      <Field label="Crew Member"><select style={inp} value={form.crewId} onChange={e=>setForm({...form,crewId:e.target.value})}>
        <option value="">Select crew</option>{available.map(c=><option key={c.id} value={c.id}>{c.name} (⭐{c.rating||"—"})</option>)}</select></Field>
      <Field label="Role"><select style={inp} value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
        {roleOptions.map(r=><option key={r}>{r}</option>)}</select></Field>
      <Field label="Fee (RM)" hint={`Suggested: ${fmt(suggestedFee(form.role,form.crewId))} (role tier → this person's default → camp type default)`}>
        <input type="number" style={inp} value={form.feeOverride} onChange={e=>setForm({...form,feeOverride:e.target.value})} placeholder={fmt(suggestedFee(form.role,form.crewId))}/></Field>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={add} style={btn("primary")}>Assign</button>
      </div>
    </Modal>}
  </div>;
}

  const openEdit=(i)=>{setForm({...i});setEditing(i.id);setShowModal(true);};
  const save=()=>{const list=editing?inventory.map(i=>i.id===editing?form:i):[...inventory,form];setDB({inventory:list});logAction(actor.role,actor.name,editing?"EDIT_ITEM":"ADD_ITEM",form.name);refresh();setShowModal(false);};
  const del=(id)=>{const i=inventory.find(x=>x.id===id);if(window.confirm("Delete?")){setDB({inventory:inventory.filter(i=>i.id!==id)});logAction(actor.role,actor.name,"DELETE_ITEM",i?.name);refresh();}};
  const adjust=(id,d)=>{setDB({inventory:inventory.map(i=>i.id===id?{...i,qty:Math.max(0,(parseInt(i.qty)||0)+d)}:i)});refresh();};

        <Field label="Unit"><input style={inp} value={form.unit||"pcs"} onChange={e=>setForm({...form,unit:e.target.value})}/></Field>
        <Field label="Current Qty"><input type="number" style={inp} value={form.qty||0} onChange={e=>setForm({...form,qty:e.target.value})}/></Field>
        <Field label="Low Stock Alert at"><input type="number" style={inp} value={form.minQty||5} onChange={e=>setForm({...form,minQty:e.target.value})}/></Field>
      </div>

}

// ── REPORTS ──
function Reports({db,onHome}){
  const sessions=db.sessions||[];const payments=db.payments||[];const expenses=db.expenses||[];
  const report=sessions.map(s=>{
    const school=(db.schools||[]).find(sc=>sc.id===s.schoolId);
    const ct=(db.campTypes||[]).find(c=>c.id===s.campTypeId);
    const regs=(db.registrations||[]).filter(r=>r.sessionId===s.id);
    const rev=payments.filter(p=>p.sessionId===s.id&&p.status!=="refunded").reduce((a,p)=>a+parseFloat(p.amount||0),0);
    const exp=expenses.filter(e=>e.sessionId===s.id).reduce((a,e)=>a+parseFloat(e.amount||0),0);
    const crew=(db.crewAssignments||[]).filter(a=>a.sessionId===s.id).reduce((a,c)=>a+parseFloat(c.fee||0),0);
    return{...s,school,ct,regs,rev,exp:exp+crew,net:rev-exp-crew};
  });
  const totalRev=report.reduce((a,s)=>a+s.rev,0);
  const totalExp=report.reduce((a,s)=>a+s.exp,0);
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Reports"]} onHome={onHome} title="Reports"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:18}}>
      <StatCard label="Total Revenue" value={fmt(totalRev)} color="#16a34a"/>
      <StatCard label="Total Expenses" value={fmt(totalExp)} color="#ef4444"/>
      <StatCard label="Net P&L" value={fmt(totalRev-totalExp)} color={(totalRev-totalExp)>=0?"#16a34a":"#ef4444"}/>
    </div>
    <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{background:"var(--surface2)"}}>
            {["Camp Type","School","Date","Students","Revenue","Expenses","Net P&L","Status"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:700,color:"var(--muted)",fontSize:11,textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {report.length===0?<tr><td colSpan={8} style={{padding:"24px",textAlign:"center",color:"var(--muted)"}}>No sessions yet.</td></tr>:
            report.map((s,i)=><tr key={s.id} style={{borderTop:"1px solid var(--border)",background:i%2?"var(--surface2)":"transparent"}}>
              <td style={{padding:"10px 12px",fontWeight:600}}>{s.ct?.name||"—"}</td>
              <td style={{padding:"10px 12px"}}>{s.school?.name||"—"}</td>
              <td style={{padding:"10px 12px"}}>{fmtDate(s.date)}</td>
              <td style={{padding:"10px 12px"}}>{s.regs.length}</td>
              <td style={{padding:"10px 12px"}}>{fmt(s.rev)}</td>
              <td style={{padding:"10px 12px"}}>{fmt(s.exp)}</td>
              <td style={{padding:"10px 12px",fontWeight:700,color:s.net>=0?"#16a34a":"#ef4444"}}>{fmt(s.net)}</td>
              <td style={{padding:"10px 12px"}}><Badge label={s.status} color={s.status==="completed"?"green":s.status==="scheduled"?"amber":"red"}/></td>
            </tr>)}
          </tbody>
        </table>
      </div>
    </div>
  </div>;
}

// ── COMMUNICATIONS ──
function Communications({db,refresh,onHome,actor}){
  const [form,setForm]=useState({sessionId:"",message:""});
  const comms=db.communications||[];const sessions=db.sessions||[];
  const getParents=(sid)=>{const regs=(db.registrations||[]).filter(r=>r.sessionId===sid);return regs.map(r=>{const s=(db.students||[]).find(st=>st.id===r.studentId);return s?{name:s.parentName,phone:s.parentPhone}:null;}).filter(Boolean);};
  const send=()=>{
    if(!form.sessionId||!form.message)return;
    const parents=getParents(form.sessionId);
    setDB({communications:[...comms,{id:uid(),sessionId:form.sessionId,message:form.message,sentAt:new Date().toISOString(),recipientCount:parents.length}]});
    refresh();
    if(parents[0])window.open(`https://wa.me/${parents[0].phone.replace(/[^0-9]/g,"")}?text=${encodeURIComponent(form.message)}`,"_blank");
    setForm({sessionId:"",message:""});
  };
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Communications"]} onHome={onHome} title="Communications"/>
    {userCanSub(actor,"communications_send")?<div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:18,marginBottom:18}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:12}}>Send Broadcast Message</div>
      <Field label="Session"><select style={inp} value={form.sessionId} onChange={e=>setForm({...form,sessionId:e.target.value})}>
        <option value="">Select session</option>
        {sessions.map(s=>{const school=(db.schools||[]).find(sc=>sc.id===s.schoolId);const ct=(db.campTypes||[]).find(c=>c.id===s.campTypeId);return <option key={s.id} value={s.id}>{school?.name} — {ct?.name} ({fmtDate(s.date)})</option>;})}
      </select></Field>
      {form.sessionId&&<div style={{fontSize:12,color:"var(--muted)",marginBottom:10}}>{getParents(form.sessionId).length} parent contacts</div>}
      <Field label="Message"><textarea style={{...inp,minHeight:80}} value={form.message} onChange={e=>setForm({...form,message:e.target.value})} placeholder="Type your message..."/></Field>
      <button onClick={send} style={btn("primary")}>📲 Send via WhatsApp</button>
    </div>
    :<div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",marginBottom:18,fontSize:12,color:"var(--muted)"}}>
      💡 Sending broadcasts is restricted for your account. You can view the message log below.
    </div>}
    <SectionHeader label="Message Log"/>
    {comms.length===0?<EmptyState icon="💬" text="No messages sent yet."/>:
    <div style={{display:"grid",gap:8}}>
      {[...comms].reverse().map(c=>{const s=sessions.find(ss=>ss.id===c.sessionId);const school=(db.schools||[]).find(sc=>sc.id===s?.schoolId);return <div key={c.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontWeight:600,fontSize:13}}>{school?.name||"—"} · {fmtDate(c.sentAt)}</div>
        <div style={{fontSize:12,color:"var(--muted)"}}>{c.recipientCount} recipients</div>
        <div style={{fontSize:13,marginTop:4}}>{c.message}</div>
      </div>;})}
    </div>}
  </div>;
}

function BackupRestore({db,refresh,actor,onHome}){
  const [lastBackup,setLastBackup]=useState(()=>localStorage.getItem("happyDino_lastBackup")||null);
  const [driveStatus,setDriveStatus]=useState("");
  const [driveBusy,setDriveBusy]=useState(false);
  const [showDriveFiles,setShowDriveFiles]=useState(false);
  const [driveFiles,setDriveFiles]=useState([]);
  const [driveFilesLoading,setDriveFilesLoading]=useState(false);
  const [previewData,setPreviewData]=useState(null); // {name, counts} for viewer read-only preview
  const [pinPrompt,setPinPrompt]=useState(null); // {purpose:'download'|'decrypt', resolve}
  const [decryptFile,setDecryptFile]=useState(null);
  const drive=useGoogleDrive();
  const editable=canEdit(actor,"backup");
  const exportPin=db.settings?.exportPin||"";
  const esc=(v)=>{if(v==null)return"";const s=String(v);if(s.includes(",")||s.includes('"')||s.includes("\n"))return`"${s.replace(/"/g,'""')}"`;return s;};
  const row=(...cells)=>cells.map(esc).join(",")+"\n";

  const buildCombinedCSV=()=>{
    const d=getDB();
    const now=new Date().toISOString();
    let csv="";
    csv+=`"==== HAPPY DINO XPERIENCE CAMP — FULL EXPORT ===="\n`;
    csv+=`"Export Date:","${fmtDate(now)}"\n`;
    csv+=`"Exported by:","${d.settings?.companyName||"Happy Dino"}"\n\n`;
    csv+=`"---- SCHOOLS ----"\n`;
    csv+=row("Name","Address","Principal","Phone","Email","Sessions","Students","Notes");
    (d.schools||[]).forEach(s=>{const sc=(d.sessions||[]).filter(ss=>ss.schoolId===s.id).length;const st=(d.students||[]).filter(st=>st.schoolId===s.id).length;csv+=row(s.name,s.address,s.principal,s.phone,s.email,sc,st,s.notes);});
    csv+="\n";
    csv+=`"---- STUDENTS ----"\n`;
    csv+=row("Name","Chinese Name","Gender","IC/MyKid","DOB","Age","Class","School","T-Shirt","Parent Name","Relation","Parent Phone","Parent Extra Phones","Bank Name","Bank Account No","Emergency Name","Emergency Phone","Emergency Extra Phones","Allergies","Camps Attended","Upcoming Camps");
    (d.students||[]).forEach(s=>{
      const school=(d.schools||[]).find(sc=>sc.id===s.schoolId);
      const regs=(d.registrations||[]).filter(r=>r.studentId===s.id);
      const attended=regs.filter(r=>{const sess=(d.sessions||[]).find(ss=>ss.id===r.sessionId);return sess?.status==="completed";}).length;
      const upcoming=regs.filter(r=>{const sess=(d.sessions||[]).find(ss=>ss.id===r.sessionId);return sess?.status==="scheduled";}).length;
      csv+=row(s.name,s.nameChinese||"",s.gender||"",s.ic,s.dob,calcAge(s.dob),s.className,school?.name||"",s.tshirtSize,s.parentName,s.parentRelation,s.parentPhone,(s.parentPhoneExtra||[]).filter(Boolean).join("; "),s.bankName||"",s.bankAccountNo||"",s.emergencyName,s.emergencyPhone,(s.emergencyPhoneExtra||[]).filter(Boolean).join("; "),s.allergies,attended,upcoming);
    });
    csv+="\n";
    csv+=`"---- CAMP TYPES ----"\n`;
    csv+=row("Name","Fee (RM)","Crew Fee Tiers","Material Cost","Meal Cost","Sibling Discount","2nd %","3rd %","Sessions Used");
    (d.campTypes||[]).forEach(c=>{
      const sessions=(d.sessions||[]).filter(s=>s.campTypeId===c.id).length;
      const tiersStr=(c.crewFeeTiers&&c.crewFeeTiers.length>0)?c.crewFeeTiers.map(t=>`${t.role||"—"}:${t.fee||0}`).join("; "):(c.crewFee||"");
      csv+=row(c.name,c.fee,tiersStr,c.materialCost,c.mealCost,c.discountable?"Yes":"No",c.sibling2Pct,c.sibling3Pct,sessions);
    });
    csv+="\n";
    csv+=`"---- CAMP SESSIONS ----"\n`;
    csv+=row("School","Camp Type","Date","Time","Status","Students Registered","Crew Assigned","Revenue (RM)","Expenses (RM)","Net P&L (RM)");
    (d.sessions||[]).forEach(s=>{
      const school=(d.schools||[]).find(sc=>sc.id===s.schoolId);
      const ct=(d.campTypes||[]).find(c=>c.id===s.campTypeId);
      const regs=(d.registrations||[]).filter(r=>r.sessionId===s.id).length;
      const crew=(d.crewAssignments||[]).filter(a=>a.sessionId===s.id).length;
      const rev=(d.payments||[]).filter(p=>p.sessionId===s.id&&p.status!=="refunded").reduce((a,p)=>a+parseFloat(p.amount||0),0);
      const exp=(d.expenses||[]).filter(e=>e.sessionId===s.id).reduce((a,e)=>a+parseFloat(e.amount||0),0);
      const crewCost=(d.crewAssignments||[]).filter(a=>a.sessionId===s.id).reduce((a,c)=>a+parseFloat(c.fee||0),0);
      csv+=row(school?.name||"",ct?.name||"",s.date,s.time||"",s.status,regs,crew,rev.toFixed(2),exp.toFixed(2),(rev-exp-crewCost).toFixed(2));
    });
    csv+="\n";
    csv+=`"---- REGISTRATIONS ----"\n`;
    csv+=row("Student","School","Camp Type","Session Date","Fee (RM)","Payment Status","Invoice No","Paid Date","Consent Signed","Attended");
    (d.registrations||[]).forEach(r=>{
      const student=(d.students||[]).find(s=>s.id===r.studentId);
      const session=(d.sessions||[]).find(s=>s.id===r.sessionId);
      const school=(d.schools||[]).find(s=>s.id===session?.schoolId);
      const ct=(d.campTypes||[]).find(c=>c.id===session?.campTypeId);
      const pay=(d.payments||[]).find(p=>p.registrationId===r.id);
      csv+=row(student?.name||"",school?.name||"",ct?.name||"",session?.date||"",r.fee,pay?.status||"",pay?.invoiceNo||"",pay?.paidAt?fmtDate(pay.paidAt):"",r.consentSigned?"Yes":"No",r.present?"Yes":"No");
    });
    csv+="\n";
    csv+=`"---- PAYMENTS ----"\n`;
    csv+=row("Invoice No","Student","School","Camp Type","Session Date","Amount (RM)","Status","Paid Date","Method");
    (d.payments||[]).forEach(p=>{
      const student=(d.students||[]).find(s=>s.id===p.studentId);
      const session=(d.sessions||[]).find(s=>s.id===p.sessionId);
      const school=(d.schools||[]).find(s=>s.id===session?.schoolId);
      const ct=(d.campTypes||[]).find(c=>c.id===session?.campTypeId);
      csv+=row(p.invoiceNo,student?.name||"",school?.name||"",ct?.name||"",session?.date||"",p.amount,p.status,p.paidAt?fmtDate(p.paidAt):"",p.method||"");
    });
    csv+="\n";
    csv+=`"---- CREW ----"\n`;
    csv+=row("Name","Chinese Name","Gender","NRIC","DOB","Age","Phone","Email","Default Fee (RM)","Rating","Total Sessions","Total Earned (RM)","Unpaid Sessions");
    (d.crew||[]).forEach(c=>{const asgn=(d.crewAssignments||[]).filter(a=>a.crewId===c.id);const earned=asgn.reduce((a,x)=>a+parseFloat(x.fee||0),0);const unpaid=asgn.filter(a=>!a.paid).length;csv+=row(c.name,c.nameChinese||"",c.gender||"",c.nric,c.dob,calcAge(c.dob),c.phone,c.email,c.defaultFee||"",c.rating,asgn.length,earned.toFixed(2),unpaid);});
    csv+="\n";
    csv+=`"---- CREW ASSIGNMENTS ----"\n`;
    csv+=row("Crew Name","School","Camp Type","Session Date","Role","Fee (RM)","Paid");
    (d.crewAssignments||[]).forEach(a=>{
      const crew=(d.crew||[]).find(c=>c.id===a.crewId);
      const session=(d.sessions||[]).find(s=>s.id===a.sessionId);
      const school=(d.schools||[]).find(s=>s.id===session?.schoolId);
      const ct=(d.campTypes||[]).find(c=>c.id===session?.campTypeId);
      csv+=row(crew?.name||"",school?.name||"",ct?.name||"",session?.date||"",a.role,a.fee,a.paid?"Yes":"No");
    });
    csv+="\n";
    csv+=`"---- EXPENSES ----"\n`;
    csv+=row("School","Camp Type","Session Date","Category","Label","Amount (RM)","KM","Rate/KM","Notes");
    (d.expenses||[]).forEach(e=>{
      const session=(d.sessions||[]).find(s=>s.id===e.sessionId);
      const school=(d.schools||[]).find(s=>s.id===session?.schoolId);
      const ct=(d.campTypes||[]).find(c=>c.id===session?.campTypeId);
      csv+=row(school?.name||"",ct?.name||"",session?.date||"",e.category,e.label,e.amount,e.km||"",e.ratePerKm||"",e.notes||"");
    });
    csv+="\n";
    csv+=`"---- INVENTORY ----"\n`;
    csv+=row("Name","Category","SKU","Unit Cost (RM)","Qty","Unit","Total Value (RM)","Min Qty","Low Stock","Notes");
    (d.inventory||[]).forEach(i=>{const val=parseFloat(i.unitCost||0)*parseInt(i.qty||0);const low=parseInt(i.qty)<=parseInt(i.minQty||0);csv+=row(i.name,i.category,i.sku||"",i.unitCost,i.qty,i.unit,val.toFixed(2),i.minQty,low?"YES":"no",i.notes||"");});
    csv+="\n";
    csv+=`"---- COMMUNICATIONS ----"\n`;
    csv+=row("School","Session Date","Sent At","Message","Recipients");
    (d.communications||[]).forEach(c=>{const session=(d.sessions||[]).find(s=>s.id===c.sessionId);const school=(d.schools||[]).find(s=>s.id===session?.schoolId);csv+=row(school?.name||"",session?.date||"",fmtDate(c.sentAt),c.message,c.recipientCount);});
    return csv;
  };

  const markBackedUp=()=>{const now=new Date().toISOString();localStorage.setItem("happyDino_lastBackup",now);setLastBackup(now);};

  // Prompts for the export PIN if one is configured, otherwise resolves immediately
  // with an empty string (encryption skipped). Used before every local download.
  const askExportPin=()=>{
    return new Promise((resolve)=>{
      if(!exportPin){resolve("");return;}
      setPinPrompt({purpose:"download",resolve});
    });
  };

  const downloadFile=(filename,content)=>{
    const a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(content);a.download=filename;a.click();
  };

  // ---- SAVE: LOCAL (always encrypted if an Export PIN is set in Settings) ----
  const saveLocalCSV=async()=>{
    const pin=await askExportPin();
    if(pin===null)return; // cancelled
    const csv=buildCombinedCSV();
    const ts=new Date().toISOString().slice(0,10);
    try{
      if(pin){
        const enc=await encryptText(csv,pin);
        downloadFile(`happy-dino-export-${ts}.csv.hdenc`,enc);
      } else {
        downloadFile(`happy-dino-export-${ts}.csv`,csv);
      }
    }catch(e){alert("Could not prepare the download: "+e.message);return;}
    markBackedUp();
    logAction(actor.role,actor.name,"EXPORT_CSV",`Combined CSV downloaded locally${pin?" (encrypted)":""}`);
  };
  const saveLocalJSON=async()=>{
    const pin=await askExportPin();
    if(pin===null)return;
    const data=JSON.stringify(getDB(),null,2);
    const ts=new Date().toISOString().slice(0,10);
    try{
      if(pin){
        const enc=await encryptText(data,pin);
        downloadFile(`happy-dino-backup-${ts}.json.hdenc`,enc);
      } else {
        downloadFile(`happy-dino-backup-${ts}.json`,data);
      }
    }catch(e){alert("Could not prepare the download: "+e.message);return;}
    markBackedUp();
    logAction(actor.role,actor.name,"EXPORT_JSON",`Full JSON backup downloaded locally${pin?" (encrypted)":""}`);
  };

  // ---- LOAD: LOCAL ----
  const loadLocalJSON=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      let text=ev.target.result;
      if(file.name.endsWith(".hdenc")){
        const pin=await new Promise((resolve)=>setPinPrompt({purpose:"decrypt",resolve}));
        if(pin===null){e.target.value="";return;}
        try{ text=await decryptText(text,pin); }
        catch{ alert("Could not decrypt — wrong PIN or this isn't a valid encrypted Happy Dino file."); e.target.value=""; return; }
      }
      try{
        saveDB(JSON.parse(text));
        refresh();
        logAction(actor.role,actor.name,"IMPORT_DATA","Restored from local JSON backup");
        alert("Data restored successfully from local file!");
        e.target.value="";
      }catch{alert("Invalid backup file — please choose a valid Happy Dino JSON backup.");}
    };
    reader.readAsText(file);
  };

  // ---- DECRYPT TOOL (standalone — turns a .hdenc file back into a normal downloadable file) ----
  const handleDecryptFileChosen=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{ setDecryptFile({name:file.name,content:ev.target.result}); };
    reader.readAsText(file);
    e.target.value="";
  };
  const runDecryptAndDownload=async()=>{
    if(!decryptFile)return;
    const pin=await new Promise((resolve)=>setPinPrompt({purpose:"decrypt",resolve}));
    if(pin===null)return;
    try{
      const plain=await decryptText(decryptFile.content,pin);
      const outName=decryptFile.name.replace(/\.hdenc$/,"");
      downloadFile(outName,plain);
      setDecryptFile(null);
    }catch{ alert("Could not decrypt — wrong PIN or this isn't a valid encrypted Happy Dino file."); }
  };

  // ---- SAVE: GOOGLE DRIVE (write actions — blocked for Viewer) ----
  const switchGoogleAccount=async()=>{
    setDriveBusy(true);setDriveStatus("Opening Google account picker...");
    const res=await drive.switchAccount();
    if(res.ok){setDriveStatus(`✓ Switched account — now signed in as ${drive.account||"the selected account"}.`);}
    else{setDriveStatus("⚠ "+(res.reason||"Could not switch account."));}
    setDriveBusy(false);
  };
  const saveToDriveJSON=async()=>{
    setDriveBusy(true);setDriveStatus("Connecting to Google Drive...");
    const data=JSON.stringify(getDB(),null,2);
    const ts=new Date().toISOString().slice(0,10);
    const res=await drive.uploadToDrive(`happy-dino-backup-${ts}.json`,data,"application/json");
    if(res.ok){setDriveStatus(`✓ Saved "happy-dino-backup-${ts}.json" to Google Drive successfully!`);markBackedUp();logAction(actor.role,actor.name,"DRIVE_SAVE_JSON","Backup saved to Drive");}
    else{setDriveStatus("⚠ "+(res.reason||"Drive save failed for an unknown reason."));}
    setDriveBusy(false);
  };
  const saveToDriveCSV=async()=>{
    setDriveBusy(true);setDriveStatus("Connecting to Google Drive...");
    const csv=buildCombinedCSV();
    const ts=new Date().toISOString().slice(0,10);
    const res=await drive.uploadToDrive(`happy-dino-export-${ts}.csv`,csv,"text/csv");
    if(res.ok){setDriveStatus(`✓ Saved "happy-dino-export-${ts}.csv" to Google Drive successfully!`);markBackedUp();logAction(actor.role,actor.name,"DRIVE_SAVE_CSV","CSV export saved to Drive");}
    else{setDriveStatus("⚠ "+(res.reason||"Drive save failed for an unknown reason."));}
    setDriveBusy(false);
  };

  // ---- LOAD: GOOGLE DRIVE ----
  // Everyone (including Viewer) can browse and list backups — this is read-only.
  const browseDriveFiles=async()=>{
    setShowDriveFiles(true);setDriveFilesLoading(true);setDriveStatus("");
    const res=await drive.listDriveFiles();
    if(res.ok){setDriveFiles(res.files.filter(f=>f.name.endsWith(".json")));}
    else{setDriveStatus("⚠ "+(res.reason||"Could not list Drive files."));setShowDriveFiles(false);}
    setDriveFilesLoading(false);
  };
  // Admin/Finance/User: actually restores (overwrites current data).
  const restoreFromDriveFile=async(file)=>{
    if(!window.confirm(`Restore from "${file.name}"? This will overwrite all current data.`))return;
    setDriveBusy(true);setDriveStatus(`Downloading "${file.name}"...`);
    const res=await drive.downloadDriveFile(file.id);
    if(res.ok){
      try{
        saveDB(JSON.parse(res.content));
        refresh();
        setDriveStatus(`✓ Restored from "${file.name}" successfully!`);
        logAction(actor.role,actor.name,"DRIVE_RESTORE",`Restored from Drive file: ${file.name}`);
        setShowDriveFiles(false);
      }catch{setDriveStatus("⚠ That file isn't a valid Happy Dino JSON backup.");}
    }else{setDriveStatus("⚠ "+(res.reason||"Could not download that file."));}
    setDriveBusy(false);
  };
  // Viewer: preview only — downloads the file just to compute record counts, never
  // calls saveDB, so current app data is never touched.
  const previewDriveFile=async(file)=>{
    setDriveBusy(true);setDriveStatus(`Loading preview of "${file.name}"...`);
    const res=await drive.downloadDriveFile(file.id);
    if(res.ok){
      try{
        const parsed=JSON.parse(res.content);
        const counts=Object.fromEntries(["schools","students","campTypes","sessions","registrations","crew","crewAssignments","payments","expenses","inventory","communications"].map(k=>[k,(parsed[k]||[]).length]));
        setPreviewData({name:file.name,counts,modifiedTime:file.modifiedTime});
        setDriveStatus("");
      }catch{setDriveStatus("⚠ That file isn't a valid Happy Dino JSON backup.");}
    }else{setDriveStatus("⚠ "+(res.reason||"Could not download that file."));}
    setDriveBusy(false);
  };

  const counts=Object.fromEntries(["schools","students","campTypes","sessions","registrations","crew","crewAssignments","payments","expenses","inventory","communications"].map(k=>[k,(db[k]||[]).length]));

  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Backup & Restore"]} onHome={onHome} title="Backup & Restore"/>
    {lastBackup&&<div style={{background:"#dcfce7",border:"1px solid #bbf7d0",borderRadius:10,padding:"10px 14px",marginBottom:18,fontSize:13,color:"#16a34a"}}>✓ Last backup: <b>{fmtDate(lastBackup)}</b></div>}
    {!lastBackup&&<div style={{background:"#fef3c7",border:"1px solid #fde68a",borderRadius:10,padding:"10px 14px",marginBottom:18,fontSize:13,color:"#d97706"}}>⚠ No backup recorded yet. Export your data regularly to avoid loss.</div>}
    {!exportPin&&<div style={{background:"#fef3c7",border:"1px solid #fde68a",borderRadius:10,padding:"10px 14px",marginBottom:18,fontSize:12,color:"#d97706"}}>⚠ No Export PIN is set in Settings — local downloads are currently unencrypted. An Admin can set one in Settings → Local Download Security.</div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:24}}>
      {Object.entries({Schools:counts.schools,Students:counts.students,"Camp Types":counts.campTypes,Sessions:counts.sessions,Registrations:counts.registrations,Payments:counts.payments,Crew:counts.crew,Expenses:counts.expenses,Inventory:counts.inventory}).map(([k,v])=><div key={k} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 12px",textAlign:"center"}}>
        <div style={{fontSize:20,fontWeight:800,color:"var(--accent)"}}>{v}</div>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>{k}</div>
      </div>)}
    </div>

    {/* ===== SAVE SECTION ===== */}
    <SectionHeader label="💾 Save Backup"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14,marginBottom:24}}>
      <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:18}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4,display:"flex",alignItems:"center",gap:6}}>🖥️ Save to This Device</div>
        {userCanSub(actor,"backup_save")?<>
          <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>Downloads a file to your computer or phone's Downloads folder.{exportPin&&" The file will be PIN-encrypted."}</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={saveLocalCSV} style={btn("primary")}>⬇ CSV (Excel)</button>
            <button onClick={saveLocalJSON} style={btn("ghost")}>⬇ JSON (Full)</button>
          </div>
        </>:<div style={{fontSize:12,color:"var(--muted)"}}>Saving to device is restricted for your account.</div>}
      </div>
      <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:18}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>☁️ Save to Google Drive</div>
        {!userCanSub(actor,"backup_save")?<div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>Saving to Drive is restricted for your account.</div>:<>
        {drive.account?
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:10}}>
            <Badge label={`Signed in as ${drive.account}`} color="green"/>
            <button onClick={switchGoogleAccount} disabled={driveBusy} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>Switch account</button>
          </div>
          :<div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>Saves directly into your team's shared Drive folder. First use will ask you to sign in — make sure to pick the correct Google account if you have more than one.</div>}
        {drive.initFailed&&<div style={{background:"#fee2e2",border:"1px solid #fecaca",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:11,color:"#dc2626"}}>
          ⚠ Google sign-in failed to load. This usually means a browser extension (ad-blocker/privacy blocker) is blocking Google's scripts, or you're offline. Try disabling blockers for this site, or use a different browser, then reload the page.
        </div>}
        {!drive.ready&&!drive.initFailed&&<div style={{fontSize:11,color:"var(--muted)",marginBottom:10}}>⏳ Connecting to Google services...</div>}
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={saveToDriveCSV} disabled={driveBusy} style={{...btn("blue"),opacity:driveBusy?0.6:1}}>☁ CSV to Drive</button>
          <button onClick={saveToDriveJSON} disabled={driveBusy} style={{...btn("blue"),opacity:driveBusy?0.6:1}}>☁ JSON to Drive</button>
        </div>
        </>}
      </div>
    </div>

    {/* ===== LOAD / RESTORE SECTION ===== */}
    <SectionHeader label="⬆ Load / Restore Backup"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14,marginBottom:16}}>
      <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:18}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4,display:"flex",alignItems:"center",gap:6}}>🖥️ Restore from This Device</div>
        {userCanSub(actor,"backup_restore")?<>
          <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}><b style={{color:"#ef4444"}}>Warning:</b> overwrites all current data with the file you choose. Accepts plain .json or encrypted .json.hdenc files.</div>
          <label style={{...btn("danger"),display:"inline-block",cursor:"pointer"}}>⬆ Choose Backup File <input type="file" accept=".json,.hdenc" style={{display:"none"}} onChange={loadLocalJSON}/></label>
        </>:<div style={{fontSize:12,color:"var(--muted)"}}>Restoring is restricted for your account.</div>}
      </div>
      <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:18}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4,display:"flex",alignItems:"center",gap:6}}>☁️ {userCanSub(actor,"backup_restore")?"Restore from Google Drive":"Browse Drive Backups"}</div>
        <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>{userCanSub(actor,"backup_restore")?"Browse and restore from a backup previously saved to Drive.":"Browse and preview old backups — your account can inspect contents without changing any live data."}</div>
        <button onClick={browseDriveFiles} disabled={driveBusy} style={{...btn("blue"),opacity:driveBusy?0.6:1}}>☁ Browse Drive Backups</button>
      </div>
    </div>

    {showDriveFiles&&<div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:16,marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontWeight:700,fontSize:13}}>Backups found in Drive folder</div>
        <button onClick={()=>setShowDriveFiles(false)} style={{...btn("ghost"),padding:"4px 10px",fontSize:11}}>Close</button>
      </div>
      {driveFilesLoading?<div style={{fontSize:12,color:"var(--muted)"}}>Loading...</div>:
        driveFiles.length===0?<div style={{fontSize:12,color:"var(--muted)"}}>No JSON backup files found in the Drive folder yet.</div>:
        <div style={{display:"grid",gap:6}}>
          {driveFiles.map(f=><div key={f.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,padding:"8px 12px",background:"var(--surface2)",borderRadius:8}}>
            <div>
              <div style={{fontSize:12,fontWeight:600}}>{f.name}</div>
              <div style={{fontSize:11,color:"var(--muted)"}}>Modified: {fmtDateTime(f.modifiedTime)}</div>
            </div>
            {editable?
              <button onClick={()=>restoreFromDriveFile(f)} disabled={driveBusy} style={{...btn("danger"),fontSize:11,padding:"4px 10px"}}>Restore this</button>
              :<button onClick={()=>previewDriveFile(f)} disabled={driveBusy} style={{...btn("ghost"),fontSize:11,padding:"4px 10px"}}>👁 Preview</button>}
          </div>)}
        </div>}
    </div>}

    {previewData&&<Modal title={`Preview: ${previewData.name}`} onClose={()=>setPreviewData(null)}>
      <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>Read-only preview — viewing this does not change any live data. Last modified: {fmtDateTime(previewData.modifiedTime)}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8}}>
        {Object.entries({Schools:previewData.counts.schools,Students:previewData.counts.students,"Camp Types":previewData.counts.campTypes,Sessions:previewData.counts.sessions,Registrations:previewData.counts.registrations,Payments:previewData.counts.payments,Crew:previewData.counts.crew,Expenses:previewData.counts.expenses,Inventory:previewData.counts.inventory}).map(([k,v])=><div key={k} style={{background:"var(--surface2)",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
          <div style={{fontSize:16,fontWeight:800,color:"var(--accent)"}}>{v}</div>
          <div style={{fontSize:10,color:"var(--muted)",fontWeight:600}}>{k}</div>
        </div>)}
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}>
        <button onClick={()=>setPreviewData(null)} style={btn("ghost")}>Close</button>
      </div>
    </Modal>}

    {/* ===== DECRYPT TOOL ===== */}
    <SectionHeader label="🔓 Decrypt a Downloaded File"/>
    <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:18,marginBottom:16}}>
      <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>If you have a <code>.hdenc</code> file downloaded earlier from this app, choose it here to decrypt it back into a normal, readable CSV or JSON file (requires the Export PIN it was created with).</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <label style={{...btn("ghost"),display:"inline-block",cursor:"pointer"}}>Choose .hdenc File <input type="file" accept=".hdenc" style={{display:"none"}} onChange={handleDecryptFileChosen}/></label>
        {decryptFile&&<>
          <span style={{fontSize:12,color:"var(--text)"}}>{decryptFile.name}</span>
          <button onClick={runDecryptAndDownload} style={btn("primary")}>🔓 Decrypt & Download</button>
        </>}
      </div>
    </div>

    {driveStatus&&<div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",fontSize:12,color:"var(--text)",marginBottom:16}}>{driveStatus}</div>}

    <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 16px",fontSize:11,color:"var(--muted)"}}>
      ℹ️ Google Drive save/load requires this app to be hosted online (e.g. GitHub Pages) with your domain authorized in Google Cloud Console. It will not work when opening this file directly from your computer. If a sign-in popup doesn't appear, check that your browser isn't blocking popups for this site. If a save reports success but the file isn't visible in your folder, use "Switch account" above to confirm you're signed into the same Google account that owns the target Drive folder — saves go to whichever account was used to sign in. For privacy, this app only requests access to files it creates itself (not your whole Drive) — so "Browse Drive Backups" will only list backups previously saved by this app, not pre-existing files placed into the folder another way.
    </div>

    {pinPrompt&&<Modal title={pinPrompt.purpose==="download"?"Enter Export PIN":"Enter Decryption PIN"} onClose={()=>{pinPrompt.resolve(null);setPinPrompt(null);}}>
      <div style={{fontSize:12,color:"var(--muted)",marginBottom:12}}>{pinPrompt.purpose==="download"?"This PIN will encrypt the file you're about to download. You'll need it again to open the file later.":"Enter the PIN this file was encrypted with."}</div>
      <PinPromptInput onSubmit={(pin)=>{pinPrompt.resolve(pin);setPinPrompt(null);}} onCancel={()=>{pinPrompt.resolve(null);setPinPrompt(null);}}/>
    </Modal>}
  </div>;
}

// Small helper component for the PIN entry modal — keeps its own input state cleanly.
function PinPromptInput({onSubmit,onCancel}){
  const [val,setVal]=useState("");
  return <div>
    <input type="password" autoFocus style={inp} value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&val&&onSubmit(val)} placeholder="PIN / passphrase"/>
    <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}>
      <button onClick={onCancel} style={btn("ghost")}>Cancel</button>
      <button onClick={()=>val&&onSubmit(val)} style={btn("primary")}>Confirm</button>
    </div>
  </div>;
}

// ── SETTINGS ──
function Settings({db,refresh,onHome}){
  const [form,setForm]=useState({...db.settings});
  const [sizeForm,setSizeForm]=useState(db.tshirtSizes||[]);
  const save=()=>{setDB({settings:form});refresh();alert("Settings saved!");};
  const addSize=()=>setSizeForm([...sizeForm,{id:uid(),label:"",chest:""}]);
  const updateSize=(i,field,val)=>{const arr=[...sizeForm];arr[i]={...arr[i],[field]:val};setSizeForm(arr);};
  const removeSize=(i)=>setSizeForm(sizeForm.filter((_,j)=>j!==i));
  const saveSizes=()=>{
    const cleaned=sizeForm.filter(s=>s.label.trim());
    setDB({tshirtSizes:cleaned});setSizeForm(cleaned);refresh();alert("T-Shirt sizes saved!");
  };
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Settings"]} onHome={onHome} title="Settings"/>
    <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:18,marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:12}}>Company Information</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
