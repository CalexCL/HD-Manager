// ── MANAGE USERS (Admin only) ──
function ManageUsers({actor,onHome}){
  const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);

  const loadUsers=async()=>{
    const F=window.HDFirebase;
    if(!F||!F.ready)return;
    setLoading(true);
    try{
      const snap=await F.getDocs(F.collection(F.db,"users"));
      const list=[];
      snap.forEach(d=>list.push({id:d.id,...d.data()}));
      setUsers(list);
    }catch(e){console.error("Failed to load users",e);}
    setLoading(false);
  };
  useEffect(()=>{loadUsers();},[]);

  const openAdd=()=>{setForm({email:"",name:"",password:"",role:"user"});setEditing(null);setErr("");setShowModal(true);};
  const openEdit=(u)=>{setForm({...u,password:""});setEditing(u.id);setErr("");setShowModal(true);};

  const save=async()=>{
    const F=window.HDFirebase;
    const email=(form.email||"").trim().toLowerCase();
    if(!form.name?.trim()){setErr("Name is required.");return;}
    if(!email||!email.includes("@")){setErr("A valid email address is required.");return;}
    if(!editing&&!form.password){setErr("Password is required for a new account.");return;}
    setBusy(true);setErr("");
    try{
      if(editing){
        // Editing only updates the Firestore profile (name/role). Changing another
        // person's password isn't possible client-side without their own session —
        // that requires a Firebase Admin SDK call from a server, which this static
        // app doesn't have. Password resets should go through "Forgot password"
        // (not yet wired) or be done by the person themselves once logged in.
        await F.setDoc(F.doc(F.db,"users",editing),{name:form.name.trim(),email,role:form.role||"user",permissions:form.permissions||defaultPermissions(form.role||"user")},{merge:true});
        logAction(actor.role,actor.name,"EDIT_USER",`${form.name} (${email}, ${form.role})`);
      } else {
        // Creating a new Firebase Auth user automatically signs the browser in as
        // that new user, which would kick the Admin out mid-task. We avoid that by
        // NOT calling createUserWithEmailAndPassword on the Admin's own active app
        // instance — instead we use a secondary, throwaway Firebase app instance
        // purely for account creation, so the Admin's own session is untouched.
        // (Uses initializeApp/getAuth already exposed on window.HDFirebase, loaded
        // once at page-load via a <script type="module"> tag — NOT a dynamic
        // import() here, since this code runs through Babel's in-browser transpiler
        // which doesn't support dynamic import() correctly.)
        const secondaryApp = F.initializeApp(F.config, "secondary-"+Date.now());
        const secondaryAuth = F.getAuth(secondaryApp);
        const cred = await F.createUserWithEmailAndPassword(secondaryAuth, email, form.password);
        await F.setDoc(F.doc(F.db,"users",cred.user.uid),{name:form.name.trim(),email,role:form.role||"user",permissions:form.permissions||defaultPermissions(form.role||"user")});
        await F.signOut(secondaryAuth);
        logAction(actor.role,actor.name,"ADD_USER",`${form.name} (${email}, ${form.role})`);
      }
      await loadUsers();
      setShowModal(false);
    }catch(e){
      let msg=e.message||"Could not save user.";
      if(e.code==="auth/email-already-in-use")msg="That email is already registered.";
      else if(e.code==="auth/weak-password")msg="Password should be at least 6 characters.";
      else if(e.code==="auth/invalid-email")msg="That doesn't look like a valid email address.";
      setErr(msg);
    }
    setBusy(false);
  };

  const del=async(u)=>{
    const adminCount=users.filter(x=>x.role==="admin").length;
    if(u.role==="admin"&&adminCount<=1){alert("Cannot delete the last remaining Admin account.");return;}
    if(u.id===actor.id){alert("You cannot delete the account you're currently logged in as.");return;}
    if(!window.confirm(`Delete user "${u.name}"? This removes their access immediately, but — due to a client-side limitation — their Firebase Authentication login may need separate cleanup by whoever manages the Firebase Console, otherwise they could still technically sign in with no profile (and the app will fail closed, treating them as unauthorized).`))return;
    const F=window.HDFirebase;
    try{
      await F.deleteDoc(F.doc(F.db,"users",u.id));
      logAction(actor.role,actor.name,"DELETE_USER",`${u.name} (${u.email})`);
      await loadUsers();
    }catch(e){alert("Could not delete user: "+e.message);}
  };

  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Manage Users"]} onHome={onHome} title="Manage Users" action={<button onClick={openAdd} style={btn("primary")}>+ Add User</button>}/>
    <div style={{fontSize:12,color:"var(--muted)",marginTop:-12,marginBottom:14}}>Accounts are stored centrally (Firebase) — anyone you add here can log in from any device immediately. Actions they take are recorded under their name in the Audit Log.</div>
    {loading?<EmptyState icon="⏳" text="Loading users..."/>:
    <div style={{display:"grid",gap:10}}>
      {users.map(u=>{
        return <div key={u.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,alignItems:"center"}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{fontWeight:700,fontSize:14}}>{u.name}</div>
                <RoleBadge role={u.role}/>
                {u.id===actor.id&&<Badge label="You" color="blue"/>}
              </div>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{u.email}</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"flex-start"}}>
              <button onClick={()=>openEdit(u)} style={btn("ghost")}>Edit</button>
              <button onClick={()=>del(u)} style={btn("danger")}>Del</button>
            </div>
          </div>
        </div>;
      })}
    </div>}
    {showModal&&<Modal title={editing?"Edit User":"Add User"} onClose={()=>setShowModal(false)} wide>
      <Field label="Full Name"><input style={inp} value={form.name||""} onChange={e=>setForm({...form,name:e.target.value})}/></Field>
      <Field label="Email Address" hint="Used to log in">
        <input type="email" style={inp} value={form.email||""} onChange={e=>setForm({...form,email:e.target.value})} autoCapitalize="none" autoCorrect="off" disabled={!!editing}/>
      </Field>
      {!editing&&<Field label="Password" hint="At least 6 characters">
        <input style={inp} value={form.password||""} onChange={e=>setForm({...form,password:e.target.value})}/>
      </Field>}
      {editing&&<Field label="Password" hint="Password changes aren't available from this screen — the person can change their own password once logged in (feature coming later), or you can reset it directly in the Firebase Console.">
        <input style={{...inp,background:"var(--surface2)",color:"var(--muted)"}} value="••••••••" disabled/>
      </Field>}
      <Field label="Role">
        <select style={inp} value={form.role||"user"} onChange={e=>{
          const newRole=e.target.value;
          // When role changes, reset permissions to the defaults for that role
          // so the permission editor starts from a sensible baseline.
          setForm({...form,role:newRole,permissions:defaultPermissions(newRole)});
        }}>
          <option value="admin">Admin — full access (ignores permissions below)</option>
          <option value="finance">Finance</option>
          <option value="user">User</option>
          <option value="viewer">Viewer</option>
        </select>
      </Field>

      {form.role!=="admin"&&<div style={{marginTop:14}}>
        <div style={{fontWeight:700,fontSize:12,color:"var(--muted)",textTransform:"uppercase",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>Page Access Permissions</span>
          <button onClick={()=>setForm({...form,permissions:defaultPermissions(form.role)})} style={{...btn("ghost"),fontSize:10,padding:"2px 8px"}}>Reset to role defaults</button>
        </div>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:10}}>Configure exactly what this person can see and do. Changes take effect the next time they log in.</div>
        <PermissionEditor permissions={form.permissions||defaultPermissions(form.role||"user")} onChange={p=>setForm({...form,permissions:p})}/>
      </div>}

      {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:10,marginTop:8}}>{err}</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={save} disabled={busy} style={{...btn("primary"),opacity:busy?0.6:1}}>{busy?"Saving...":"Save"}</button>
      </div>
    </Modal>}
  </div>;
}

function PermissionEditor({permissions,onChange}){
  const p={...permissions};
  const setAccess=(key,val)=>onChange({...p,[key]:val});
  const setSub=(key,val)=>onChange({...p,[key]:val});
  const ACCESS_OPTS=[
    {val:"hidden",label:"Hidden",color:"#94a3b8"},
    {val:"view",label:"View only",color:"#2563eb"},
    {val:"full",label:"Full access",color:"#16a34a"},
  ];
  return <div style={{border:"1px solid var(--border)",borderRadius:10,overflow:"hidden"}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr auto",background:"var(--surface2)",padding:"6px 12px",fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.06em"}}>
      <div>Page</div><div style={{minWidth:220,textAlign:"center"}}>Access Level</div>
    </div>
    {PERMISSION_PAGES.map((page,i)=>{
      const current=p[page.key]||"hidden";
      return <div key={page.key} style={{borderTop:"1px solid var(--border)",background:i%2?"var(--surface2)":"var(--surface)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",gap:8}}>
          <div style={{fontSize:13,fontWeight:500}}>{page.label}</div>
          <div style={{display:"flex",gap:4}}>
            {ACCESS_OPTS.map(opt=><button key={opt.val} onClick={()=>setAccess(page.key,opt.val)}
              style={{padding:"4px 10px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,
                background:current===opt.val?opt.color:"var(--border)",
                color:current===opt.val?"#fff":"var(--muted)",transition:"all 0.15s"}}>
              {opt.label}
            </button>)}
          </div>
        </div>
        {page.subs&&current!=="hidden"&&<div style={{paddingLeft:24,paddingBottom:8,paddingRight:12}}>
          {page.subs.map(sub=><label key={sub.key} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:12,color:"var(--muted)",marginBottom:4}}>
            <input type="checkbox" checked={p[sub.key]===true} onChange={e=>setSub(sub.key,e.target.checked)}
              style={{width:14,height:14}}/>
            {sub.label}
          </label>)}
        </div>}
      </div>;
    })}
  </div>;
}

// ── ACCOUNTING: INVOICES ──
function AcctInvoices({db,refresh,actor,onHome}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const invoices=db.accountingInvoices||[];
  const editable=canEdit(actor,"acctInvoices")||actor.role==="finance";
  const blankLines=()=>[{id:uid(),description:"",qty:1,unitPrice:""}];
  const openAdd=()=>{setForm({id:uid(),docNo:nextDocNo("INV"),date:new Date().toISOString().slice(0,10),dueDate:"",toName:"",toAddress:"",sessionId:"",lines:blankLines(),sstPct:0,notes:"",status:"Draft"});setEditing(null);setShowModal(true);};
  const openEdit=(inv)=>{setForm({...inv,lines:inv.lines||blankLines()});setEditing(inv.id);setShowModal(true);};
  const autoPopulate=()=>{
    if(!form.sessionId){alert("Select a session first.");return;}
    const sess=(db.sessions||[]).find(s=>s.id===form.sessionId);
    const school=(db.schools||[]).find(s=>s.id===sess?.schoolId);
    const ct=(db.campTypes||[]).find(c=>c.id===sess?.campTypeId);
    const regs=(db.registrations||[]).filter(r=>r.sessionId===form.sessionId);
    if(regs.length===0){alert("No registrations found for this session.");return;}
    const lines=regs.map(r=>{const st=(db.students||[]).find(s=>s.id===r.studentId);
      return {id:uid(),description:`Camp fee — ${st?.name||"Student"} (${ct?.name||""})`,qty:1,unitPrice:r.fee||ct?.fee||0};});
    setForm({...form,toName:school?.name||"",toAddress:school?.address||"",lines});
  };
  const save=()=>{
    const list=editing?invoices.map(i=>i.id===editing?form:i):[...invoices,form];
    setDB({accountingInvoices:list});logAction(actor.role,actor.name,editing?"EDIT_INVOICE":"ADD_INVOICE",form.docNo);
    refresh();setShowModal(false);
  };
  const del=(id)=>{if(!window.confirm("Delete invoice?"))return;
    setDB({accountingInvoices:invoices.filter(i=>i.id!==id)});refresh();};
  const doPrint=(inv)=>{
    const html=buildDocHtml(db.settings,{docType:"INVOICE",docNo:inv.docNo,date:inv.date,
      toName:inv.toName,toAddress:inv.toAddress,lines:inv.lines,sstPct:inv.sstPct,notes:inv.notes,
      extraMeta:`<div style="font-size:12px;color:#555">Due: ${fmtDate(inv.dueDate)||"—"}</div>`,
      footer:"Payment due within 30 days. Thank you for your business."});
    printDoc(html);
  };
  const statuses=["Draft","Sent","Partially Paid","Paid","Overdue","Cancelled"];
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Accounting","Invoices"]} onHome={onHome} title="Invoices"
      action={editable&&<button onClick={openAdd} style={btn("primary")}>+ New Invoice</button>}/>
    {invoices.length===0?<EmptyState icon="📄" text="No invoices yet."/>:
    <div style={{display:"grid",gap:8}}>
      {[...invoices].reverse().map(inv=>{
        const total=calcDocTotal(inv.lines,inv.sstPct);
        return <div key={inv.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontWeight:700}}>{inv.docNo}</span>
                <DocStatusBadge status={inv.status}/>
              </div>
              <div style={{fontSize:13,marginTop:2}}>{inv.toName}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>Issued: {fmtDate(inv.date)} · Due: {fmtDate(inv.dueDate)||"—"} · {inv.lines?.length||0} items</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <span style={{fontWeight:800,fontSize:15,color:"var(--accent)"}}>RM {total.toFixed(2)}</span>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>doPrint(inv)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>🖨 Print</button>
                {editable&&<button onClick={()=>openEdit(inv)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>Edit</button>}
                {editable&&<button onClick={()=>del(inv.id)} style={{...btn("danger"),fontSize:11,padding:"3px 8px"}}>Del</button>}
              </div>
            </div>
          </div>
        </div>;
      })}
    </div>}
    {showModal&&<Modal title={editing?"Edit Invoice":"New Invoice"} onClose={()=>setShowModal(false)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <Field label="Invoice No"><input style={{...inp,background:"var(--surface2)",color:"var(--muted)"}} value={form.docNo||""} readOnly/></Field>
        <Field label="Status"><select style={inp} value={form.status||"Draft"} onChange={e=>setForm({...form,status:e.target.value})}>
          {statuses.map(s=><option key={s}>{s}</option>)}</select></Field>
        <Field label="Invoice Date"><input type="date" style={inp} value={form.date||""} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Due Date"><input type="date" style={inp} value={form.dueDate||""} onChange={e=>setForm({...form,dueDate:e.target.value})}/></Field>
      </div>
      <div style={{fontWeight:700,fontSize:12,color:"var(--muted)",margin:"10px 0 6px",textTransform:"uppercase"}}>Bill To</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <Field label="Name / Company"><input style={inp} value={form.toName||""} onChange={e=>setForm({...form,toName:e.target.value})}/></Field>
        <Field label="Link to Session (for auto-populate)">
          <select style={inp} value={form.sessionId||""} onChange={e=>setForm({...form,sessionId:e.target.value})}>
            <option value="">None</option>
            {(db.sessions||[]).map(s=>{const sc=(db.schools||[]).find(x=>x.id===s.schoolId);const ct=(db.campTypes||[]).find(x=>x.id===s.campTypeId);
              return <option key={s.id} value={s.id}>{fmtDate(s.date)} — {sc?.name||"?"} ({ct?.name||"?"})</option>;})}
          </select>
        </Field>
      </div>
      <Field label="Address"><textarea style={{...inp,minHeight:50}} value={form.toAddress||""} onChange={e=>setForm({...form,toAddress:e.target.value})}/></Field>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"10px 0 6px"}}>
        <div style={{fontWeight:700,fontSize:12,color:"var(--muted)",textTransform:"uppercase"}}>Line Items</div>
        <button onClick={autoPopulate} style={{...btn("ghost"),fontSize:11,padding:"4px 10px"}}>⚡ Auto-populate from Session</button>
      </div>
      <LineItemEditor lines={form.lines||[]} onChange={lines=>setForm({...form,lines})}/>
      <SstField sstPct={form.sstPct||0} onChange={v=>setForm({...form,sstPct:v})} subtotal={calcSubtotal(form.lines||[])}/>
      <Field label="Notes" hint="Appears on the printed invoice">

      </Field>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={save} style={btn("primary")}>Save</button>

  </div>;
}

// ── ACCOUNTING: PAYMENTS (INCOMING) ──
function AcctPayments({db,refresh,actor,onHome}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const payments=db.accountingPayments||[];
  const editable=canEdit(actor,"acctPayments")||actor.role==="finance";
  const openAdd=()=>{setForm({id:uid(),docNo:nextDocNo("PAY"),date:new Date().toISOString().slice(0,10),payerName:"",amount:"",method:"Cash",reference:"",invoiceId:"",notes:""});setEditing(null);setShowModal(true);};
  const openEdit=(p)=>{setForm({...p});setEditing(p.id);setShowModal(true);};
  const save=()=>{
    const isNew=!editing;
    const list=editing?payments.map(p=>p.id===editing?form:p):[...payments,form];
    const updates={accountingPayments:list};
    // Auto-generate a receipt when a new payment is recorded
    if(isNew){
      const recNo=nextDocNo("REC");
      const receipt={id:uid(),docNo:recNo,date:form.date,paymentId:form.id,payerName:form.payerName,amount:form.amount,method:form.method,invoiceId:form.invoiceId,notes:form.notes,status:"Issued"};
      updates.receipts=[...(db.receipts||[]),receipt];
    }
    setDB(updates);logAction(actor.role,actor.name,editing?"EDIT_ACCT_PAYMENT":"ADD_ACCT_PAYMENT",form.docNo);
    refresh();setShowModal(false);
  };
  const del=(id)=>{if(!window.confirm("Delete payment?"))return;setDB({accountingPayments:payments.filter(p=>p.id!==id)});refresh();};
  const total=payments.reduce((a,p)=>a+parseFloat(p.amount||0),0);
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Accounting","Payments"]} onHome={onHome} title="Payments Received"
      action={editable&&<button onClick={openAdd} style={btn("primary")}>+ Record Payment</button>}/>
    <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
      <div style={{fontSize:11,color:"var(--muted)"}}>Total Received</div>
      <div style={{fontWeight:800,fontSize:20,color:"var(--accent)"}}>RM {total.toFixed(2)}</div>
    </div>
    {payments.length===0?<EmptyState icon="💰" text="No payments recorded yet."/>:
    <div style={{display:"grid",gap:8}}>
      {[...payments].reverse().map(p=>{
        const inv=(db.accountingInvoices||[]).find(i=>i.id===p.invoiceId);
        return <div key={p.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:700}}>{p.docNo}</span><Badge label={p.method} color="blue"/></div>
              <div style={{fontSize:13,marginTop:2}}>{p.payerName}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{fmtDate(p.date)}{p.reference&&` · Ref: ${p.reference}`}{inv&&` · Invoice: ${inv.docNo}`}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <span style={{fontWeight:800,fontSize:15,color:"var(--accent)"}}>RM {parseFloat(p.amount||0).toFixed(2)}</span>
              <div style={{display:"flex",gap:6}}>
                {editable&&<button onClick={()=>openEdit(p)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>Edit</button>}
                {editable&&<button onClick={()=>del(p.id)} style={{...btn("danger"),fontSize:11,padding:"3px 8px"}}>Del</button>}
              </div>
            </div>
          </div>
        </div>;
      })}
    </div>}
    {showModal&&<Modal title={editing?"Edit Payment":"Record Payment"} onClose={()=>setShowModal(false)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <Field label="Payment Ref No"><input style={{...inp,background:"var(--surface2)",color:"var(--muted)"}} value={form.docNo||""} readOnly/></Field>
        <Field label="Date"><input type="date" style={inp} value={form.date||""} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Received From"><input style={inp} value={form.payerName||""} onChange={e=>setForm({...form,payerName:e.target.value})}/></Field>
        <Field label="Amount (RM)"><input type="number" style={inp} value={form.amount||""} onChange={e=>setForm({...form,amount:e.target.value})}/></Field>
        <Field label="Payment Method"><select style={inp} value={form.method||"Cash"} onChange={e=>setForm({...form,method:e.target.value})}>
          {PAYMENT_METHODS.map(m=><option key={m}>{m}</option>)}</select></Field>
        <Field label="Reference No (cheque/transfer)"><input style={inp} value={form.reference||""} onChange={e=>setForm({...form,reference:e.target.value})}/></Field>
      </div>
      <Field label="Link to Invoice (optional)"><select style={inp} value={form.invoiceId||""} onChange={e=>setForm({...form,invoiceId:e.target.value})}>
        <option value="">None</option>
        {(db.accountingInvoices||[]).map(i=><option key={i.id} value={i.id}>{i.docNo} — {i.toName} (RM {calcDocTotal(i.lines,i.sstPct).toFixed(2)})</option>)}
      </select></Field>
      <Field label="Notes"><textarea style={{...inp,minHeight:50}} value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
      {!editing&&<div style={{fontSize:12,color:"var(--muted)",marginTop:6}}>💡 A receipt will be automatically generated when this payment is saved.</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={save} style={btn("primary")}>Save</button>
      </div>
    </Modal>}
  </div>;
}

function CreditNotes({db,refresh,actor,onHome}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const creditNotes=db.creditNotes||[];
  const editable=canEdit(actor,"creditNotes")||actor.role==="finance";
  const blankLines=()=>[{id:uid(),description:"",qty:1,unitPrice:""}];
  const openAdd=()=>{setForm({id:uid(),docNo:nextDocNo("CN"),date:new Date().toISOString().slice(0,10),toName:"",invoiceId:"",lines:blankLines(),sstPct:0,reason:"",notes:"",status:"Draft"});setEditing(null);setShowModal(true);};
  const openEdit=(cn)=>{setForm({...cn,lines:cn.lines||blankLines()});setEditing(cn.id);setShowModal(true);};
  const save=()=>{
    const list=editing?creditNotes.map(c=>c.id===editing?form:c):[...creditNotes,form];
    setDB({creditNotes:list});logAction(actor.role,actor.name,editing?"EDIT_CREDIT_NOTE":"ADD_CREDIT_NOTE",form.docNo);
    refresh();setShowModal(false);
  };
  const del=(id)=>{if(!window.confirm("Delete credit note?"))return;setDB({creditNotes:creditNotes.filter(c=>c.id!==id)});refresh();};
  const doPrint=(cn)=>{
    const inv=cn.invoiceId?(db.accountingInvoices||[]).find(i=>i.id===cn.invoiceId):null;
    const html=buildDocHtml(db.settings,{docType:"CREDIT NOTE",docNo:cn.docNo,date:cn.date,
      toName:cn.toName,toAddress:"",lines:cn.lines,sstPct:cn.sstPct,notes:cn.notes,
      extraMeta:inv?`<div style="font-size:12px;color:#555">Re: Invoice ${inv.docNo}</div>`:"",
      footer:cn.reason?`Reason: ${cn.reason}`:"Credit note issued."});
    printDoc(html);
  };
  const statuses=["Draft","Issued","Applied","Cancelled"];
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Accounting","Credit Notes"]} onHome={onHome} title="Credit Notes"
      action={editable&&<button onClick={openAdd} style={btn("primary")}>+ New Credit Note</button>}/>
    {creditNotes.length===0?<EmptyState icon="🔄" text="No credit notes yet."/>:
    <div style={{display:"grid",gap:8}}>
      {[...creditNotes].reverse().map(cn=>{
        const total=calcDocTotal(cn.lines,cn.sstPct);
        const inv=cn.invoiceId?(db.accountingInvoices||[]).find(i=>i.id===cn.invoiceId):null;
        return <div key={cn.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:700}}>{cn.docNo}</span><DocStatusBadge status={cn.status}/></div>
              <div style={{fontSize:13,marginTop:2}}>{cn.toName}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{fmtDate(cn.date)}{inv&&` · Re: ${inv.docNo}`}{cn.reason&&` · ${cn.reason}`}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <span style={{fontWeight:800,fontSize:15,color:"#dc2626"}}>−RM {total.toFixed(2)}</span>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>doPrint(cn)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>🖨 Print</button>
                {editable&&<button onClick={()=>openEdit(cn)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>Edit</button>}
                {editable&&<button onClick={()=>del(cn.id)} style={{...btn("danger"),fontSize:11,padding:"3px 8px"}}>Del</button>}
              </div>
            </div>
          </div>
        </div>;
      })}
    </div>}
    {showModal&&<Modal title={editing?"Edit Credit Note":"New Credit Note"} onClose={()=>setShowModal(false)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <Field label="Credit Note No"><input style={{...inp,background:"var(--surface2)",color:"var(--muted)"}} value={form.docNo||""} readOnly/></Field>
        <Field label="Status"><select style={inp} value={form.status||"Draft"} onChange={e=>setForm({...form,status:e.target.value})}>
          {statuses.map(s=><option key={s}>{s}</option>)}</select></Field>
        <Field label="Date"><input type="date" style={inp} value={form.date||""} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Link to Original Invoice"><select style={inp} value={form.invoiceId||""} onChange={e=>{
          const inv=(db.accountingInvoices||[]).find(i=>i.id===e.target.value);
          setForm({...form,invoiceId:e.target.value,toName:inv?.toName||form.toName});
        }}>
          <option value="">None</option>
          {(db.accountingInvoices||[]).map(i=><option key={i.id} value={i.id}>{i.docNo} — {i.toName}</option>)}
        </select></Field>
      </div>
      <Field label="Issue To"><input style={inp} value={form.toName||""} onChange={e=>setForm({...form,toName:e.target.value})}/></Field>
      <Field label="Reason for Credit Note"><input style={inp} value={form.reason||""} onChange={e=>setForm({...form,reason:e.target.value})}/></Field>
      <div style={{fontWeight:700,fontSize:12,color:"var(--muted)",margin:"10px 0 6px",textTransform:"uppercase"}}>Credit Line Items</div>
      <LineItemEditor lines={form.lines||[]} onChange={lines=>setForm({...form,lines})}/>
      <SstField sstPct={form.sstPct||0} onChange={v=>setForm({...form,sstPct:v})} subtotal={calcSubtotal(form.lines||[])}/>
      <Field label="Notes"><textarea style={{...inp,minHeight:50}} value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={save} style={btn("primary")}>Save</button>
      </div>
    </Modal>}
  </div>;
}

function Refunds({db,refresh,actor,onHome}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const refunds=db.refunds||[];
  const editable=canEdit(actor,"refunds")||actor.role==="finance";
  const openAdd=()=>{setForm({id:uid(),docNo:nextDocNo("REF"),date:new Date().toISOString().slice(0,10),toName:"",amount:"",method:"Bank Transfer",reference:"",paymentId:"",creditNoteId:"",reason:"",notes:""});setEditing(null);setShowModal(true);};
  const openEdit=(r)=>{setForm({...r});setEditing(r.id);setShowModal(true);};
  const save=()=>{
    const list=editing?refunds.map(r=>r.id===editing?form:r):[...refunds,form];
    setDB({refunds:list});logAction(actor.role,actor.name,editing?"EDIT_REFUND":"ADD_REFUND",form.docNo);
    refresh();setShowModal(false);
  };
  const del=(id)=>{if(!window.confirm("Delete refund?"))return;setDB({refunds:refunds.filter(r=>r.id!==id)});refresh();};
  const doPrint=(r)=>{
    const cn=r.creditNoteId?(db.creditNotes||[]).find(c=>c.id===r.creditNoteId):null;
    const pmt=r.paymentId?(db.accountingPayments||[]).find(p=>p.id===r.paymentId):null;
    const html=buildDocHtml(db.settings,{docType:"REFUND VOUCHER",docNo:r.docNo,date:r.date,
      toName:r.toName,toAddress:"",
      lines:[{id:"1",description:`Refund via ${r.method}${r.reference?` (Ref: ${r.reference})`:""}`+(cn?` — Credit Note: ${cn.docNo}`:"")+(pmt?` — Payment: ${pmt.docNo}`:""),qty:1,unitPrice:r.amount}],
      sstPct:0,notes:r.notes,footer:r.reason?`Reason: ${r.reason}`:"Refund processed."});
    printDoc(html);
  };
  const total=refunds.reduce((a,r)=>a+parseFloat(r.amount||0),0);
  return <div>
    <PageHeader crumbs={[{label:"Dashboard",nav:onHome},"Accounting","Refunds"]} onHome={onHome} title="Refunds"
      action={editable&&<button onClick={openAdd} style={btn("primary")}>+ Record Refund</button>}/>
    <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
      <div style={{fontSize:11,color:"var(--muted)"}}>Total Refunded</div>
      <div style={{fontWeight:800,fontSize:20,color:"#dc2626"}}>RM {total.toFixed(2)}</div>
    </div>
    {refunds.length===0?<EmptyState icon="↩️" text="No refunds yet."/>:
    <div style={{display:"grid",gap:8}}>
      {[...refunds].reverse().map(r=>{
        const cn=r.creditNoteId?(db.creditNotes||[]).find(c=>c.id===r.creditNoteId):null;
        return <div key={r.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:700}}>{r.docNo}</span><Badge label={r.method} color="blue"/></div>
              <div style={{fontSize:13,marginTop:2}}>{r.toName}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{fmtDate(r.date)}{cn&&` · CN: ${cn.docNo}`}{r.reason&&` · ${r.reason}`}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <span style={{fontWeight:800,fontSize:15,color:"#dc2626"}}>−RM {parseFloat(r.amount||0).toFixed(2)}</span>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>doPrint(r)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>🖨 Print</button>
                {editable&&<button onClick={()=>openEdit(r)} style={{...btn("ghost"),fontSize:11,padding:"3px 8px"}}>Edit</button>}
                {editable&&<button onClick={()=>del(r.id)} style={{...btn("danger"),fontSize:11,padding:"3px 8px"}}>Del</button>}
              </div>
            </div>
          </div>
        </div>;
      })}
    </div>}
    {showModal&&<Modal title={editing?"Edit Refund":"Record Refund"} onClose={()=>setShowModal(false)} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
        <Field label="Refund Ref No"><input style={{...inp,background:"var(--surface2)",color:"var(--muted)"}} value={form.docNo||""} readOnly/></Field>
        <Field label="Date"><input type="date" style={inp} value={form.date||""} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Refund To"><input style={inp} value={form.toName||""} onChange={e=>setForm({...form,toName:e.target.value})}/></Field>
        <Field label="Amount (RM)"><input type="number" style={inp} value={form.amount||""} onChange={e=>setForm({...form,amount:e.target.value})}/></Field>
        <Field label="Refund Method"><select style={inp} value={form.method||"Bank Transfer"} onChange={e=>setForm({...form,method:e.target.value})}>
          {PAYMENT_METHODS.map(m=><option key={m}>{m}</option>)}</select></Field>
        <Field label="Reference No"><input style={inp} value={form.reference||""} onChange={e=>setForm({...form,reference:e.target.value})}/></Field>
      </div>
      <Field label="Link to Credit Note (optional)"><select style={inp} value={form.creditNoteId||""} onChange={e=>setForm({...form,creditNoteId:e.target.value})}>
        <option value="">None</option>
        {(db.creditNotes||[]).map(c=><option key={c.id} value={c.id}>{c.docNo} — {c.toName}</option>)}
      </select></Field>
      <Field label="Link to Original Payment (optional)"><select style={inp} value={form.paymentId||""} onChange={e=>setForm({...form,paymentId:e.target.value})}>
        <option value="">None</option>
        {(db.accountingPayments||[]).map(p=><option key={p.id} value={p.id}>{p.docNo} — {p.payerName} (RM {parseFloat(p.amount||0).toFixed(2)})</option>)}
      </select></Field>
      <Field label="Reason"><input style={inp} value={form.reason||""} onChange={e=>setForm({...form,reason:e.target.value})}/></Field>
      <Field label="Notes"><textarea style={{...inp,minHeight:50}} value={form.notes||""} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
        <button onClick={()=>setShowModal(false)} style={btn("ghost")}>Cancel</button>
        <button onClick={save} style={btn("primary")}>Save</button>
      </div>
    </Modal>}
  </div>;
}
