<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Dino Xperience Camp - Full System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  const firebaseConfig = {
    apiKey: "AIzaSyC04k_HrMfybVjr-CzVfY2Zh6J9TN_RiqE", authDomain: "hd-system-manager.firebaseapp.com",
    projectId: "hd-system-manager", storageBucket: "hd-system-manager.firebasestorage.app",
    messagingSenderId: "919090115313", appId: "1:919090115313:web:d85af64c55cb825c8def50"
  };
  const app = initializeApp(firebaseConfig);
  window.HDFirebase = {
    auth: getAuth(app), db: getFirestore(app), storage: getStorage(app),
    onAuthStateChanged, signInWithEmailAndPassword, signOut,
    doc, setDoc, getDoc, collection, getDocs, deleteDoc,
    ref, uploadBytes, getDownloadURL, ready: true
  };
  window.dispatchEvent(new Event("hdfirebase-ready"));
</script>
<style>
:root{--accent:#16a34a;--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--muted:#64748b}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--surface:#1e293b;--surface2:#0f172a;--border:#334155;--text:#f1f5f9;--muted:#94a3b8}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13.5px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:var(--accent);color:#fff}.btn-g{background:var(--surface2);color:var(--text)}.btn-d{background:#ef4444;color:#fff}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:10px}td{padding:10px;border-top:1px solid var(--border)}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo,useContext,createContext,useRef}=React;
const AppDataContext = createContext();
const AuthContext = createContext();
const DB_KEY="happyDino_v1";

// --- UTILS ---
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=(n)=>`RM ${parseFloat(n||0).toFixed(2)}`;
const fmtDate=(d)=>d?new Date(d).toLocaleDateString("en-MY",{day:"2-digit",month:"short",year:"numeric"}):"—";
const calcAge=(dob)=>dob?Math.floor((Date.now()-new Date(dob).getTime())/(1000*60*60*24*365.25)):"—";
const maskAccountNo=(acc)=>{if(!acc)return"—";const d=String(acc).replace(/\s+/g,"");return d.length<=4?d:"•••• •••• "+d.slice(-4)};

const defaultPermissions=(role)=>{
  const base={finance:{schools:'view',students:'view',payments:'full',purchases:'full',reports:'view'},user:{schools:'full',students:'full',sessions:'full',crew:'full',communications:'full'},viewer:{reports:'view'}};
  return base[role]||base.viewer;
};

const userCan=(u,p,a='view')=>{
  if(!u||u.role==='admin')return true;
  const val = (u.permissions||{})[p]||'hidden';
  return a==='edit'?val==='full':val!=='hidden';
};

// --- DATA PROVIDER ---
function AppProvider({children}){
  const [db,setDbState]=useState(()=>JSON.parse(localStorage.getItem(DB_KEY)||"{}"));
  const updateDB=useCallback((p)=>{setDbState(prev=>{const n={...prev,...p};localStorage.setItem(DB_KEY,JSON.stringify(n));return n;});},[]);
  const nextDocNo=(pre)=>{
    const s={...(db.acctSeq||{INV:0,BILL:0,REC:0,PUR:0,PAY:0})};
    s[pre]=(s[pre]||0)+1;updateDB({acctSeq:s});
    return `${pre}-${new Date().getFullYear()}-${String(s[pre]).padStart(4,"0")}`;
  };
  return <AppDataContext.Provider value={{db,updateDB,nextDocNo}}>{children}</AppDataContext.Provider>;
}

// --- SHARED UI ---
const Badge=({label,color})=>{
  const c={green:["#dcfce7","#16a34a"],blue:["#dbeafe","#2563eb"],amber:["#fef3c7","#d97706"],red:["#fee2e2","#dc2626"]}[color]||["#f1f5f9","#64748b"];
  return <span style={{display:"inline-block",padding:"2px 8px",borderRadius:99,fontSize:11,fontWeight:700,background:c[0],color:c[1]}}>{label}</span>
};
const Field=({label,children})=><div style={{marginBottom:14}}><label style={{display:"block",fontSize:11,fontWeight:700,color:"var(--muted)",marginBottom:4,textTransform:"uppercase"}}>{label}</label>{children}</div>;
const Modal=({title,onClose,children,wide})=><div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div style={{background:"var(--surface)",borderRadius:16,width:"100%",maxWidth:wide?700:500,maxHeight:"90vh",overflowY:"auto",padding:24,boxShadow:"0 20px 50px rgba(0,0,0,0.3)"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:20}}><h3>{title}</h3><button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:20}}>✕</button></div>{children}</div></div>;

// --- STORAGE HELPER ---
async function uploadToCloud(file){
  const F=window.HDFirebase;
  const ref=F.ref(F.storage,`uploads/${Date.now()}-${file.name}`);
  const snap=await F.uploadBytes(ref,file);
  return await F.getDownloadURL(snap.ref);
}

// --- MODULES ---

function Dashboard(){
  const {db}=useContext(AppDataContext);
  const paid=useMemo(()=>(db.payments||[]).filter(p=>p.status==='paid').reduce((a,p)=>a+parseFloat(p.amount||0),0),[db.payments]);
  const exp=useMemo(()=>(db.expenses||[]).reduce((a,e)=>a+parseFloat(e.amount||0),0),[db.expenses]);
  return <div><h2>Dashboard</h2><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:16,marginTop:20}}>
    <div className="card" style={{borderLeft:"4px solid var(--accent)"}}><h4>Total Revenue</h4><div style={{fontSize:24,fontWeight:800}}>{fmt(paid)}</div></div>
    <div className="card" style={{borderLeft:"4px solid #ef4444"}}><h4>Expenses</h4><div style={{fontSize:24,fontWeight:800}}>{fmt(exp)}</div></div>
    <div className="card" style={{borderLeft:"4px solid #2563eb"}}><h4>Schools</h4><div style={{fontSize:24,fontWeight:800}}>{(db.schools||[]).length}</div></div>
  </div></div>;
}

function Schools(){
  const {db,updateDB}=useContext(AppDataContext);
  const {user}=useContext(AuthContext);
  const [modal,setModal]=useState({open:false,data:{}});
  const canEdit=userCan(user,'schools','edit');
  const list=db.schools||[];
  const save=()=>{
    const n = modal.data.id ? list.map(s=>s.id===modal.data.id?modal.data:s) : [...list,{...modal.data,id:uid()}];
    updateDB({schools:n});setModal({open:false,data:{}});
  };
  return <div><div style={{display:'flex',justifyContent:'space-between',marginBottom:20}}><h2>Schools</h2>{canEdit&&<button className="btn btn-p" onClick={()=>setModal({open:true,data:{}})}>+ Add School</button>}</div>
    {list.map(s=><div key={s.id} className="card" style={{display:'flex',justifyContent:'space-between'}}><div><strong>{s.name}</strong><div style={{fontSize:12,color:'var(--muted)'}}>{s.address}</div></div>
    {canEdit&&<button className="btn btn-g" onClick={()=>setModal({open:true,data:s})}>Edit</button>}</div>)}
    {modal.open&&<Modal title="School Details" onClose={()=>setModal({open:false,data:{}})}>
      <Field label="School Name"><input value={modal.data.name||""} onChange={e=>setModal({...modal,data:{...modal.data,name:e.target.value}})} /></Field>
      <Field label="Address"><input value={modal.data.address||""} onChange={e=>setModal({...modal,data:{...modal.data,address:e.target.value}})} /></Field>
      <Field label="Principal"><input value={modal.data.principal||""} onChange={e=>setModal({...modal,data:{...modal.data,principal:e.target.value}})} /></Field>
      <button className="btn btn-p" onClick={save} style={{width:'100%',marginTop:10}}>Save</button>
    </Modal>}</div>;
}

function Students(){
  const {db,updateDB}=useContext(AppDataContext);
  const {user}=useContext(AuthContext);
  const [modal,setModal]=useState({open:false,data:{}});
  const canEdit=userCan(user,'students','edit');
  const list=db.students||[];
  const sizes=db.tshirtSizes||[];
  const save=()=>{
    const n = modal.data.id ? list.map(s=>s.id===modal.data.id?modal.data:s) : [...list,{...modal.data,id:uid()}];
    updateDB({students:n});setModal({open:false,data:{}});
  };
  return <div><div style={{display:'flex',justifyContent:'space-between',marginBottom:20}}><h2>Students</h2>{canEdit&&<button className="btn btn-p" onClick={()=>setModal({open:true,data:{}})}>+ Add Student</button>}</div>
    {list.map(s=><div key={s.id} className="card" style={{display:'flex',justifyContent:'space-between'}}><div><strong>{s.name} {s.nameChinese&&`(${s.nameChinese})`}</strong><div style={{fontSize:12,color:'var(--muted)'}}>{s.className} · IC: {s.ic} · {s.parentPhone}</div></div>
    {canEdit&&<button className="btn btn-g" onClick={()=>setModal({open:true,data:s})}>Edit</button>}</div>)}
    {modal.open&&<Modal title="Student Details" onClose={()=>setModal({open:false,data:{}})} wide>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <Field label="Full Name"><input value={modal.data.name||""} onChange={e=>setModal({...modal,data:{...modal.data,name:e.target.value}})} /></Field>
        <Field label="Chinese Name"><input value={modal.data.nameChinese||""} onChange={e=>setModal({...modal,data:{...modal.data,nameChinese:e.target.value}})} /></Field>
        <Field label="IC Number"><input value={modal.data.ic||""} onChange={e=>setModal({...modal,data:{...modal.data,ic:e.target.value}})} /></Field>
        <Field label="Class"><input value={modal.data.className||""} onChange={e=>setModal({...modal,data:{...modal.data,className:e.target.value}})} /></Field>
        <Field label="Parent Name"><input value={modal.data.parentName||""} onChange={e=>setModal({...modal,data:{...modal.data,parentName:e.target.value}})} /></Field>
        <Field label="Parent Phone"><input value={modal.data.parentPhone||""} onChange={e=>setModal({...modal,data:{...modal.data,parentPhone:e.target.value}})} /></Field>
        <Field label="T-Shirt Size"><select value={modal.data.tshirtSize||""} onChange={e=>setModal({...modal,data:{...modal.data,tshirtSize:e.target.value}})}>
          <option value="">Select</option>{sizes.map(z=><option key={z.id}>{z.label}</option>)}</select></Field>
        <Field label="Date of Birth"><input type="date" value={modal.data.dob||""} onChange={e=>setModal({...modal,data:{...modal.data,dob:e.target.value}})} /></Field>
      </div>
      <Field label="Allergies"><input value={modal.data.allergies||""} onChange={e=>setModal({...modal,data:{...modal.data,allergies:e.target.value}})} /></Field>
      <button className="btn btn-p" onClick={save} style={{width:'100%',marginTop:10}}>Save Student</button>
    </Modal>}</div>;
}

function Purchases(){
  const {db,updateDB,nextDocNo}=useContext(AppDataContext);
  const {user}=useContext(AuthContext);
  const [modal,setModal]=useState({open:false,data:{}});
  const [busy,setBusy]=useState(false);
  const list=db.purchases||[];
  const save=async()=>{
    setBusy(true);try{
      let url=modal.data.photo||""; const el=document.getElementById("p-file");
      if(el?.files[0])url=await uploadToCloud(el.files[0]);
      const rec={...modal.data,photo:url,id:modal.data.id||uid()};
      const n=modal.data.id?list.map(p=>p.id===modal.data.id?rec:p):[...list,rec];
      updateDB({purchases:n});setModal({open:false,data:{}});
    }catch(e){alert(e.message)}finally{setBusy(false)}
  };
  return <div><div style={{display:'flex',justifyContent:'space-between',marginBottom:20}}><h2>Purchases</h2><button className="btn btn-p" onClick={()=>setModal({open:true,data:{docNo:nextDocNo("PUR"),date:new Date().toISOString().slice(0,10),category:'Materials'}})}>+ New Purchase</button></div>
    {list.map(p=><div key={p.id} className="card" style={{display:'flex',justifyContent:'space-between'}}><div><strong>{p.supplier}</strong><div>{fmt(p.amount)} · {p.docNo}</div></div>
    {p.photo&&<a href={p.photo} target="_blank" className="btn btn-g" style={{fontSize:11}}>View Receipt</a>}</div>)}
    {modal.open&&<Modal title={modal.data.docNo} onClose={()=>setModal({open:false,data:{}})}>
      <Field label="Supplier"><input value={modal.data.supplier||""} onChange={e=>setModal({...modal,data:{...modal.data,supplier:e.target.value}})} /></Field>
      <Field label="Amount"><input type="number" value={modal.data.amount||""} onChange={e=>setModal({...modal,data:{...modal.data,amount:e.target.value}})} /></Field>
      <Field label="Receipt Image"><input type="file" id="p-file" accept="image/*" /></Field>
      <button className="btn btn-p" onClick={save} disabled={busy} style={{width:'100%'}}>{busy?"Uploading...":"Save Record"}</button>
    </Modal>}</div>;
}

function Sessions(){
  const {db,updateDB}=useContext(AppDataContext);
  const [modal,setModal]=useState({open:false,data:{}});
  const [sel,setSel]=useState(null);
  const list=db.sessions||[];
  if(sel) return <div><button className="btn btn-g" onClick={()=>setSel(null)} style={{marginBottom:20}}>← Back</button>
    <h2>{db.schools.find(s=>s.id===sel.schoolId)?.name}</h2><p>{fmtDate(sel.date)}</p>
    <div className="card" style={{marginTop:20}}><h4>Attendance</h4>
      {(db.registrations||[]).filter(r=>r.sessionId===sel.id).map(r=>{
        const s=db.students.find(x=>x.id===r.studentId);
        return <div key={r.id} style={{display:'flex',justifyContent:'space-between',padding:8,borderTop:'1px solid var(--border)'}}><span>{s?.name}</span><input type="checkbox" style={{width:20}} checked={r.present} onChange={()=>{
          updateDB({registrations:db.registrations.map(x=>x.id===r.id?{...x,present:!x.present}:x)});
        }} /></div>
      })}
    </div></div>;
  return <div><div style={{display:'flex',justifyContent:'space-between',marginBottom:20}}><h2>Sessions</h2><button className="btn btn-p" onClick={()=>setModal({open:true,data:{status:'scheduled'}})}>+ New Session</button></div>
    {list.map(s=>{const sc=db.schools.find(x=>x.id===s.schoolId);return <div key={s.id} className="card" onClick={()=>setSel(s)} style={{cursor:'pointer',display:'flex',justifyContent:'space-between'}}>
      <div><strong>{sc?.name}</strong><div>{fmtDate(s.date)}</div></div><Badge label={s.status} color={s.status==='completed'?'green':'amber'} /></div>})}
    {modal.open&&<Modal title="New Session" onClose={()=>setModal({open:false})}>
      <Field label="School"><select onChange={e=>setModal({...modal,data:{...modal.data,schoolId:e.target.value}})}>{db.schools.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
      <Field label="Date"><input type="date" onChange={e=>setModal({...modal,data:{...modal.data,date:e.target.value}})} /></Field>
      <button className="btn btn-p" onClick={()=>{updateDB({sessions:[...list,{...modal.data,id:uid()}]});setModal({open:false})}} style={{width:'100%'}}>Create Session</button>
    </Modal>}</div>;
}

function Invoices(){
  const {db,updateDB,nextDocNo}=useContext(AppDataContext);
  const [modal,setModal]=useState({open:false,data:{}});
  const list=db.accountingInvoices||[];
  return <div><div style={{display:'flex',justifyContent:'space-between',marginBottom:20}}><h2>Invoices</h2><button className="btn btn-p" onClick={()=>setModal({open:true,data:{docNo:nextDocNo("INV"),date:new Date().toISOString().slice(0,10),status:'Draft',lines:[]}})}>+ New Invoice</button></div>
    {list.map(i=><div key={i.id} className="card" style={{display:'flex',justifyContent:'space-between'}}><div><strong>{i.docNo}</strong><div>{i.toName} · {i.status}</div></div><button className="btn btn-g" onClick={()=>setModal({open:true,data:i})}>Edit</button></div>)}
    {modal.open&&<Modal title={modal.data.docNo} onClose={()=>setModal({open:false})}>
      <Field label="Client Name"><input value={modal.data.toName||""} onChange={e=>setModal({...modal,data:{...modal.data,toName:e.target.value}})} /></Field>
      <Field label="Amount"><input type="number" value={modal.data.total||""} onChange={e=>setModal({...modal,data:{...modal.data,total:e.target.value}})} /></Field>
      <button className="btn btn-p" onClick={()=>{const n=modal.data.id?list.map(x=>x.id===modal.data.id?modal.data:x):[...list,{...modal.data,id:uid()}];updateDB({accountingInvoices:n});setModal({open:false})}} style={{width:'100%'}}>Save Invoice</button>
    </Modal>}</div>;
}

// --- MAIN APP ---
function App(){
  const {db}=useContext(AppDataContext);
  const [user,setUser]=useState(null);
  const [ready,setReady]=useState(false);
  const [page,setPage]=useState("dashboard");
  const [cred,setCred]=useState({e:"",p:""});

  useEffect(()=>{
    const F=window.HDFirebase; if(!F?.ready)return;
    return F.onAuthStateChanged(F.auth,async u=>{
      if(u){const s=await F.getDoc(F.doc(F.db,"users",u.uid));setUser(s.exists()?{id:u.uid,...s.data()}:{id:u.uid,role:'viewer',name:u.email});}
      else setUser(null);setReady(true);
    });
  },[]);

  if(!ready)return <div style={{padding:100,textAlign:'center'}}>🦕 Loading...</div>;
  if(!user)return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9'}}>
    <div className="card" style={{width:320,textAlign:'center'}}><h1>Login</h1>
    <input placeholder="Email" style={{margin:'10px 0'}} onChange={e=>setCred({...cred,e:e.target.value})} />
    <input type="password" placeholder="Password" style={{marginBottom:20}} onChange={e=>setCred({...cred,p:e.target.value})} />
    <button className="btn btn-p" style={{width:'100%'}} onClick={()=>window.HDFirebase.signInWithEmailAndPassword(window.HDFirebase.auth,cred.e,cred.p).catch(e=>alert(e.message))}>Login</button>
    </div></div>;

  const menu=[{id:"dashboard",l:"Dashboard",i:"🏠"},{id:"schools",l:"Schools",i:"🏫"},{id:"students",l:"Students",i:"🎒"},{id:"sessions",l:"Sessions",i:"📅"},{id:"purchases",l:"Purchases",i:"🧾"},{id:"invoices",l:"Invoices",i:"📄"}];
  return <div style={{display:'flex',minHeight:'100vh'}}>
    <aside style={{width:220,background:'#1e293b',color:'#fff',padding:20,position:'sticky',top:0,height:'100vh'}}>
      <h2 style={{color:'var(--accent)',marginBottom:30}}>🦕 Happy Dino</h2>
      <nav style={{display:'flex',flexDirection:'column',gap:5}}>
        {menu.map(m=><button key={m.id} onClick={()=>setPage(m.id)} style={{...btn("ghost"),textAlign:'left',color:page===m.id?'var(--accent)':'#fff',background:page===m.id?'#334155':'transparent'}}>{m.i} {m.l}</button>)}
        <button onClick={()=>window.HDFirebase.signOut(window.HDFirebase.auth)} className="btn btn-d" style={{marginTop:20}}>Logout</button>
      </nav>
    </aside>
    <main style={{flex:1,padding:40}}>
      {page==='dashboard'&&<Dashboard />}
      {page==='schools'&&<Schools />}
      {page==='students'&&<Students />}
      {page==='sessions'&&<Sessions />}
      {page==='purchases'&&<Purchases />}
      {page==='invoices'&&<Invoices />}
    </main>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppProvider><App /></AppProvider>);
</script>
</body>
</html>
